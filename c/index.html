<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* VITRA customer pages (portal + booking form; 2026-11-22). Customers see these, so they use the business's own
   look (light pages, navy band, logo pink/cyan), not Ben's Jarvis themes. */
:root { --ink: #141a33; --ink2: #4a5272; --ink3: #7c84a3; --line: #e3e6f0; --bg: #f4f5fa; --card: #fff; --navy: #121a3e; --pink: #e5317a; --pink2: #ff5a9a;
  --cyan: #13a6cc; --good: #12a06a; --warn: #c97a06; --bad: #d23c4b; --r: 14px; --sh: 0 1px 2px rgba(20,26,51,.06), 0 8px 24px rgba(20,26,51,.06); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--cyan); }
[hidden] { display: none !important; }
.band { background: radial-gradient(120% 140% at 85% -20%, rgba(229,49,122,.35), transparent 55%), radial-gradient(90% 120% at 0% 120%, rgba(19,166,204,.28), transparent 60%), var(--navy); color: #fff; padding: 22px 16px 64px; }
.band .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.logo { position: relative; width: 62px; height: 49px; flex: none; }
.logo i { position: absolute; inset: 0; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
.band h1 { margin: 0; font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.band .sub { color: rgba(255,255,255,.72); font-size: 13.5px; }
.band .call { margin-left: auto; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.3); border-radius: 99px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
main { max-width: 760px; margin: -44px auto 40px; padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 20px; }
.card h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; }
.card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); }
.muted { color: var(--ink2); } .small { font-size: 13px; }
.hello h2 { font-size: 22px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; padding: 3px 10px; border-radius: 99px; background: #eef0f7; color: var(--ink2); white-space: nowrap; }
.chip.wait { background: #fff1f6; color: var(--pink); } .chip.good { background: #e7f7f0; color: var(--good); } .chip.due { background: #fff6e5; color: var(--warn); }
.dochead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
table.lines { width: 100%; border-collapse: collapse; font-size: 14px; }
table.lines th { text-align: left; font-size: 12px; color: var(--ink3); font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--line); }
table.lines td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.lines td.n, table.lines th.n { text-align: right; white-space: nowrap; padding-left: 12px; }
table.lines .d { color: var(--ink2); font-size: 13px; white-space: pre-line; margin-top: 2px; }
.totals { margin-left: auto; width: min(280px, 100%); margin-top: 10px; font-size: 14px; }
.totals div { display: flex; justify-content: space-between; padding: 3px 0; }
.totals .g { font-weight: 750; font-size: 17px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 4px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: #c9cee0; }
.opt.on { border-color: var(--pink); background: #fff6fa; }
.opt input { margin-top: 4px; accent-color: var(--pink); }
.opt .t { font-weight: 650; } .opt .p { margin-left: auto; font-weight: 700; white-space: nowrap; }
.opt .d { color: var(--ink2); font-size: 13px; white-space: pre-line; }
.notes { white-space: pre-line; background: #f7f8fc; border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--ink2); margin-top: 12px; }
details.terms { margin-top: 12px; font-size: 13px; color: var(--ink2); }
details.terms summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.terms div { white-space: pre-line; margin-top: 8px; }
.sign { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink2); }
input[type=text], input[type=tel], input[type=email], textarea, select { font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, textarea:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(19,166,204,.15); }
.pad { position: relative; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; height: 160px; touch-action: none; }
.pad canvas { width: 100%; height: 100%; display: block; border-radius: 12px; cursor: crosshair; }
.pad .ph { position: absolute; left: 14px; bottom: 12px; right: 14px; border-top: 1px solid #d4d8e6; padding-top: 4px; font-size: 12px; color: var(--ink3); pointer-events: none; }
.pad .clr { position: absolute; right: 8px; top: 8px; font-size: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink2); cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--pink); flex: none; }
.btn { font: inherit; font-weight: 650; border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 11px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s, box-shadow .15s, background .15s; }
.btn:hover { background: #f7f8fc; } .btn:active { transform: translateY(1px); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 9px; }
.btn.primary { background: linear-gradient(135deg, var(--pink), var(--pink2)); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(229,49,122,.28); }
.btn.primary:hover { filter: brightness(1.05); background: linear-gradient(135deg, var(--pink), var(--pink2)); }
.btn.big { padding: 14px 18px; font-size: 16px; width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.err { color: var(--bad); font-size: 14px; font-weight: 600; }
.done { display: flex; gap: 12px; align-items: center; background: #e7f7f0; border-radius: 12px; padding: 14px 16px; color: #0b6b47; font-weight: 600; }
.done svg { flex: none; }
.li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .main { flex: 1; min-width: 0; } .li .t { font-weight: 650; } .li .s { color: var(--ink2); font-size: 13.5px; }
.cal { flex: none; width: 50px; text-align: center; border-radius: 10px; background: #f3f4fa; padding: 6px 0; line-height: 1.1; }
.cal small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--pink); }
.cal b { font-size: 19px; }
.inline { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; background: #f7f8fc; border-radius: 12px; padding: 12px; }
.empty { color: var(--ink3); font-size: 14px; padding: 6px 0; }
.load { text-align: center; color: var(--ink3); padding: 40px 0; }
footer { max-width: 760px; margin: 0 auto 40px; padding: 0 16px; color: var(--ink3); font-size: 12.5px; text-align: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: inline-flex; background: #eef0f7; border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { font: inherit; font-weight: 600; font-size: 14px; border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; cursor: pointer; color: var(--ink2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(20,26,51,.12); }
.svcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.svc { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 11px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
.svc.on { border-color: var(--pink); background: #fff6fa; }
.svc input { accent-color: var(--pink); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .band .call { display: none; } .card { padding: 16px; } }
body.embed { background: transparent; } body.embed .band { display: none; } body.embed main { margin-top: 0; padding: 0; } body.embed footer { display: none; }
.paybox { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 14px; }
.paybox .row .btn { flex: 1 1 220px; }
/* print / save as PDF: only the chosen estimate or invoice */
@media print {
  body { background: #fff; } .band { background: none; color: var(--ink); padding: 0 0 10px; } .band .call, footer { display: none; }
  body.printing main > *:not(.printme) { display: none !important; }
  main { margin: 0; padding: 0; max-width: none; } .card { box-shadow: none; border: 0; padding: 0; }
  .noprint, .sign, .inline { display: none !important; }
}
</style>
</head>

  $("#foot").innerHTML = `${esc(b.name)}${b.phone ? " · " + esc(b.phone) : ""}${b.email ? " · " + esc(b.email) : ""}${b.address ? "<br>" + esc(b.address) : ""}<br><span>This page is private to you. Please don't share the link.</span>`;
  const open = P.estimates.filter((e) => e.status === "open"), other = P.estimates.filter((e) => e.status !== "open");
  const resched = new Set(P.requests.filter((r) => r.kind === "reschedule" && r.status === "new").map((r) => r.ref));
  $("#main").innerHTML = `
    <section class="card hello"><h2>Hi ${esc(first)}</h2><div class="muted">${esc(P.person.address || "")}</div>
      ${open.length ? `<div style="margin-top:8px">You have ${open.length === 1 ? "an estimate" : open.length + " estimates"} waiting for your OK below.</div>` : ""}
      ${dueLine()}</section>
    ${PAYMSG}
    ${open.map(estimateCard).join("")}
    <section class="card"><h3>Your next visits</h3>${P.upcoming.length ? P.upcoming.map((j) => { const x = dt(j.date); return `<div class="li" data-job="${j.id}"><div class="cal"><small>${MON[x.getMonth()]}</small><b>${x.getDate()}</b></div>
      <div class="main"><div class="t">${DOW[x.getDay()]}${j.time ? " · " + esc(j.time) : ""}</div><div class="s">${esc(j.services.join(", "))}${j.recurring ? " · regular visit" : ""}</div>
        ${resched.has(j.id) ? '<div class="s" style="color:var(--warn)">You asked to move this one. We\'ll be in touch.</div>' : ""}
        <div class="inline" data-rs hidden><label class="f">When would work better?<input type="text" data-when maxlength="200" placeholder="e.g. any weekday next week, mornings"></label>
          <div class="row"><button class="btn sm primary" data-rsgo>Send</button><button class="btn sm" data-rsno>Cancel</button><span class="err small" data-err hidden></span></div></div></div>
      ${resched.has(j.id) ? "" : `<button class="btn sm" data-rsopen>Reschedule</button>`}</div>`; }).join("") : '<div class="empty">Nothing on the schedule right now.</div>'}</section>
    ${P.invoices.length ? `<h3 style="margin:8px 4px 0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)">Invoices</h3>${P.invoices.map(invoiceCard).join("")}` : ""}
    ${other.length ? `<h3 style="margin:8px 4px 0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)">Your estimates</h3>${other.map(estimateCard).join("")}` : ""}
    ${P.past.length ? `<section class="card"><h3>Past visits</h3>${P.past.map((j) => `<div class="li"><div class="main"><div class="t">${nice(j.date)}</div><div class="s">${esc(j.services.join(", "))}</div></div></div>`).join("")}</section>` : ""}
    <section class="card" id="ask"><h3>Questions?</h3><label class="f">Send us a message<textarea rows="3" id="q" maxlength="1500" placeholder="We'll get back to you soon."></textarea></label>
      <div class="row" style="margin-top:10px"><div class="spacer"></div><span class="err small" id="qerr" hidden></span><button class="btn primary" id="qgo">Send</button></div></section>`;
  for (const s of $$("[data-sign]")) signBox(s);
  wire();
  const focus = FOCUS && ($("#e-" + CSS.escape(FOCUS)) || $("#i-" + CSS.escape(FOCUS)));
  if (focus && !PAYMSG) setTimeout(() => focus.scrollIntoView({ behavior: "smooth", block: "start" }), 200);
}
function signBox(box) {
  const id = box.dataset.sign, cv = $("canvas", box), ctx = cv.getContext("2d");
  let drawn = false, last = null;
  const size = () => { const r = cv.getBoundingClientRect(), k = Math.min(2, devicePixelRatio || 1); cv.width = r.width * k; cv.height = r.height * k; ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = "#141a33"; drawn = false; $(".ph", box).style.opacity = 1; };
  size(); addEventListener("resize", () => { if (!drawn) size(); });
  const at = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); last = at(e); ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, 7); ctx.fillStyle = "#141a33"; ctx.fill(); drawn = true; $(".ph", box).style.opacity = .35; });
  cv.addEventListener("pointermove", (e) => { if (!last) return; const p = at(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const up = () => { last = null; }; cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  $("[data-clear]", box).onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); drawn = false; $(".ph", box).style.opacity = 1; };
  const card = box.closest("[data-doc]");
  for (const o of $$(".opt input", card)) o.onchange = () => $$(".opt", card).forEach((x) => x.classList.toggle("on", $("input", x).checked));
  $("[data-approve]", box).onclick = async (ev) => {
    const err = $("[data-err]", box); err.hidden = true;
    const show = (m) => { err.textContent = m; err.hidden = false; };
    const opt = $(".opt input:checked", card), hasOpts = $$(".opt input", card).length > 0;
    if (hasOpts && !opt) return show("Please pick the option you'd like.");
    if ($("[data-name]", box).value.trim().length < 2) return show("Please type your full name.");
    if (!drawn) return show("Please sign in the box.");
    if (!$("[data-agree]", box).checked) return show("Please tick the box to approve.");
    // the signature, shrunk to 600 px wide on white
    const out = document.createElement("canvas"), w = Math.min(600, cv.width); out.width = w; out.height = Math.round(cv.height * w / cv.width);
    const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, out.width, out.height); o.drawImage(cv, 0, 0, out.width, out.height);
    ev.currentTarget.disabled = true; ev.currentTarget.textContent = "Sending…";
    try {
      await call("approve", { estimate: id, option: opt ? +opt.value : null, name: $("[data-name]", box).value.trim(), signature: out.toDataURL("image/png"), agree: true });
      await load(); const c = $("#e-" + CSS.escape(id)); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { show(e.message); ev.currentTarget.disabled = false; ev.currentTarget.textContent = "Approve estimate"; }
  };
}
function wire() {
  for (const b of $$("[data-print]")) b.onclick = () => {
    const el = $(`[data-doc="${b.dataset.print}"]`); if (el.tagName === "DETAILS") el.open = true;
    el.classList.add("printme"); document.body.classList.add("printing"); print();
    setTimeout(() => { el.classList.remove("printme"); document.body.classList.remove("printing"); }, 500);
  };
  for (const li of $$("[data-job]")) {
    const box = $("[data-rs]", li), open = $("[data-rsopen]", li); if (!open) continue;
    open.onclick = () => { box.hidden = false; open.hidden = true; $("[data-when]", li).focus(); };
    $("[data-rsno]", li).onclick = () => { box.hidden = true; open.hidden = false; };
    $("[data-rsgo]", li).onclick = async (ev) => { const err = $("[data-err]", li); err.hidden = true; ev.currentTarget.disabled = true;
      try { await call("request", { kind: "reschedule", job: li.dataset.job, when: $("[data-when]", li).value.trim(), text: $("[data-when]", li).value.trim() }); await load(); }
      catch (e) { err.textContent = e.message; err.hidden = false; ev.currentTarget.disabled = false; } };
  }
  for (const b of $$("[data-pay]")) b.onclick = async () => {
    const box = b.closest(".paybox"), err = $("[data-perr]", box); err.hidden = true;
    $$("[data-pay]", box).forEach((x) => (x.disabled = true)); const was = b.textContent; b.textContent = "Opening secure payment…";
    try { const r = await call("pay", { invoice: b.dataset.pay, method: b.dataset.m }); location.href = r.url; }
    catch (e) { err.textContent = e.message; err.hidden = false; $$("[data-pay]", box).forEach((x) => (x.disabled = false)); b.textContent = was; }
  };
  $("#qgo").onclick = async (ev) => { const err = $("#qerr"); err.hidden = true; ev.currentTarget.disabled = true;
    try { await call("request", { kind: "question", text: $("#q").value.trim() }); $("#ask").innerHTML = `<div class="done">${OK}<div>Thanks! We got your message and will get back to you soon.</div></div>`; }
    catch (e) { err.textContent = e.message; err.hidden = false; ev.currentTarget.disabled = false; } };
}
function dueLine() {
  const due = P.invoices.reduce((s, i) => s + Math.max(0, i.balance), 0);
  return due > 0.005 ? `<div style="margin-top:8px">Balance due: <b>${usd(due)}</b>${P.pay ? " · you can pay online below." : ""}</div>` : "";
}
let PAYMSG = "";   // back from Stripe: what happened
async function load() {
  try {
    if (PAID && !PAYMSG) {
      const r = await call("paid", { session: PAID }).catch(() => ({ status: "unknown" }));
      PAYMSG = r.status === "paid" ? `<div class="done">${OK}<div>Thank you! Your payment${r.amount ? " of " + usd(r.amount) : ""} was received.</div></div>`
        : r.status === "processing" ? `<div class="done">${OK}<div>Thank you! Your bank payment${r.amount ? " of " + usd(r.amount) : ""} is on its way. It takes a few business days to clear.</div></div>`
        : `<div class="card"><b>Your payment didn't finish.</b><div class="muted small">Nothing was charged. You can try again below.</div></div>`;
    }
    P = await call("portal", {}); render();
  }
  catch (e) { $("#main").innerHTML = `<section class="card"><h2>We couldn't open this page</h2><p class="muted">${esc(e.message)}</p></section>`; }
}
if (!T) $("#main").innerHTML = `<section class="card"><h2>This link isn't complete</h2><p class="muted">Please open the full link from your text or email.</p></section>`;
else load();
</script>
