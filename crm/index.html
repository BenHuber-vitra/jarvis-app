/* VITRA CRM (2026-11-21). Colours come from Jarvis's themes (app/themes.css, chosen in Jarvis > Settings > Colours). */
:root {
  --acc: var(--th-a-hex, #ff4fb8); --acc-rgb: var(--th-a, 255,79,184); --acc2: rgb(var(--th-a2, 155,107,255)); --acc2-rgb: var(--th-a2, 155,107,255);
  --core: rgb(var(--th-core1, 79,216,255)); --core-rgb: var(--th-core1, 79,216,255);
  --ink: #f3f5ff; --ink2: var(--th-ink2, #c9d6ee); --ink3: var(--th-ink3, #9eb0d4);
  --line: rgba(var(--th-line, 255,130,210), .16); --line2: rgba(var(--th-line, 255,130,210), .3);
  --card: linear-gradient(165deg, rgba(var(--th-c1, 64,52,130), .52), rgba(var(--th-c2, 30,42,92), .5));
  --card-solid: var(--th-s2, #151a42); --input: rgba(var(--th-input, 12,14,46), .72);
  --good: #3ddc97; --warn: #ffb547; --bad: #ff5d73;
  --r: 16px; --side: 236px; --top: 64px;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14.5px/1.45 var(--font); color: var(--ink); background: var(--th-bgB, #101636);
  background: radial-gradient(1200px 700px at 100% -10%, rgba(var(--acc-rgb), .16), transparent 60%),
              radial-gradient(900px 600px at -10% 110%, rgba(var(--core-rgb), .12), transparent 60%),
              linear-gradient(180deg, var(--th-bgA, #171a46), var(--th-bgB, #101636)) fixed;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
i[data-icon] { display: inline-flex; width: 18px; height: 18px; flex: none; }
i[data-icon] svg { width: 100%; height: 100%; }
.num, td.n, .money { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- frame */
#app { display: grid; grid-template-columns: var(--side) 1fr; grid-template-rows: minmax(0, 1fr); height: 100%; }
#side { display: flex; flex-direction: column; gap: 6px; padding: 18px 12px; border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(var(--th-c1, 64,52,130), .35), rgba(0,0,0,.15)); backdrop-filter: blur(16px); overflow-y: auto; z-index: 30; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 12px 16px; }
.logo { font-weight: 800; letter-spacing: .22em; font-size: 20px;
  background: linear-gradient(90deg, var(--ink), var(--acc), var(--core)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { color: var(--ink3); letter-spacing: .3em; font-size: 11px; font-weight: 700; }
#nav { display: flex; flex-direction: column; gap: 3px; }
.navi { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px; color: var(--ink2); font-weight: 550; position: relative; transition: background .2s, color .2s; }
.navi:hover { background: rgba(255,255,255,.05); color: var(--ink); }
.navi.cur { color: var(--ink); background: linear-gradient(90deg, rgba(var(--acc-rgb), .24), rgba(var(--acc-rgb), .06)); box-shadow: inset 0 0 0 1px rgba(var(--acc-rgb), .35); }
.navi.cur i { color: var(--acc); }
.navi .badge { margin-left: auto; }
.sidefoot { margin-top: auto; display: flex; flex-direction: column; gap: 3px; padding-top: 12px; border-top: 1px solid var(--line); }
#scrim { display: none; }
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; overflow: hidden; }
#top { height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid var(--line);
  background: rgba(var(--th-nav, 26,26,70), .45); backdrop-filter: blur(14px); position: relative; z-index: 20; }
#top h1 { font-size: 19px; margin: 0; font-weight: 700; white-space: nowrap; }
#menuBtn, #searchBtn { display: none; }
#searchWrap { position: relative; flex: 1; max-width: 520px; margin-left: auto; display: flex; align-items: center; }
#searchWrap > i { position: absolute; left: 12px; color: var(--ink3); pointer-events: none; }
#search { width: 100%; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--input); padding: 0 12px 0 38px; outline: none; transition: border .2s, box-shadow .2s; }
#search:focus { border-color: rgba(var(--acc-rgb), .6); box-shadow: 0 0 0 3px rgba(var(--acc-rgb), .15); }
#searchDrop { position: absolute; top: 46px; left: 0; right: 0; background: var(--card-solid); border: 1px solid var(--line2); border-radius: 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,.5); max-height: 60vh; overflow-y: auto; display: none; padding: 6px; }
#searchDrop.on { display: block; }
.sgroup { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); padding: 8px 10px 4px; }
.sitem { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }

#view { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 22px 40px; outline: none; }

#bottom { display: none; }
.wrap { max-width: 1320px; margin: 0 auto; }

/* ---------------------------------------------------------------- building blocks */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 11px; border: 1px solid var(--line2);

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; position: relative; box-shadow: 0 14px 40px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.05); min-width: 0; }

.card h3 a.right:hover { color: var(--acc); }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.muted { color: var(--ink3); }
.small { font-size: 12.5px; }
.kpi .label { font-size: 12.5px; color: var(--ink3); font-weight: 600; letter-spacing: .04em; }
.kpi .value { font-size: 30px; font-weight: 800; letter-spacing: -.01em; margin: 4px 0 2px; font-variant-numeric: tabular-nums;
  background: linear-gradient(90deg, var(--ink), var(--th-soft, #ff8fd6)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  background: rgba(var(--acc-rgb), .16); color: var(--acc); }
.kpi.link { cursor: pointer; transition: transform .15s, box-shadow .2s; }
.kpi.link:hover { transform: translateY(-2px); box-shadow: 0 18px 46px rgba(0,0,0,.3), 0 0 0 1px rgba(var(--acc-rgb), .3); }
.up { color: var(--good); } .down { color: var(--bad); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
  background: rgba(255,255,255,.08); color: var(--ink2); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }

.pagehead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }

/* forms */

textarea { resize: vertical; }
select option { background: var(--card-solid); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.check { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; color: var(--ink2); }

/* lists / tables */
.list { display: flex; flex-direction: column; }

.li .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .s { color: var(--ink3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .amt { font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.li .amt small { display: block; font-weight: 500; color: var(--ink3); font-size: 12px; }
.avatar { width: 36px; height: 36px; border-radius: 11px; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
  background: linear-gradient(135deg, rgba(var(--acc-rgb), .35), rgba(var(--acc2-rgb), .3)); color: #fff; }
.avatar.com { background: linear-gradient(135deg, rgba(var(--core-rgb), .35), rgba(var(--acc2-rgb), .3)); }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); padding: 8px 10px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
table.t td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr.click { cursor: pointer; }

table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }

table.t .t2 { color: var(--ink3); font-size: 12.5px; }
.tablewrap { overflow-x: auto; margin: 0 -6px; }
.actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

/* charts */
.bars { display: flex; align-items: flex-end; gap: 8px; height: 190px; padding-top: 10px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; position: relative; cursor: default; }
.bar .stackb { width: 100%; max-width: 42px; display: flex; flex-direction: column-reverse; justify-content: flex-start; height: calc(100% - 22px); position: relative; }
.bar .fill { width: 100%; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--acc), rgba(var(--acc2-rgb), .8)); box-shadow: 0 0 16px rgba(var(--acc-rgb), .3); min-height: 2px; transition: height .6s cubic-bezier(.2,.8,.2,1); }
.bar .fill.booked { background: repeating-linear-gradient(135deg, rgba(var(--core-rgb), .5) 0 5px, rgba(var(--core-rgb), .25) 5px 10px); box-shadow: none; border-radius: 7px 7px 0 0; }

.bar .tip { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -4px); background: var(--card-solid); border: 1px solid var(--line2); border-radius: 9px; padding: 6px 9px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.bar:hover .tip { opacity: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink3); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.ringwrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ring { width: 150px; height: 150px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .mid b { font-size: 28px; font-weight: 800; }
.ring .mid small { color: var(--ink3); font-size: 11.5px; }
.meter { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.meter > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--acc), var(--core)); }
.split { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 180px; }
.split .rowx { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.aging { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.aging div { background: rgba(0,0,0,.2); border-radius: 10px; padding: 8px 10px; }
.aging small { color: var(--ink3); font-size: 11px; display: block; }
.aging b { font-size: 15px; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- calendar */
.calbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }

.tot { background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 10px 14px; min-width: 130px; }
.tot small { display: block; color: var(--ink3); font-size: 11.5px; font-weight: 650; letter-spacing: .04em; }
.tot b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tot.main b { background: linear-gradient(90deg, var(--ink), var(--th-soft, #ff8fd6)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 96px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.month .dow { padding: 9px 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); border-bottom: 1px solid var(--line); }

.month .wk { border-bottom: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; background: rgba(0,0,0,.14); }

.month .wk b { font-size: 14px; font-variant-numeric: tabular-nums; }
.pill { font-size: 11.5px; padding: 2px 6px; border-radius: 6px; background: rgba(var(--acc-rgb), .2); border-left: 3px solid var(--acc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.rec { background: rgba(var(--core-rgb), .16); border-left-color: var(--core); }

.jc { border-radius: 11px; padding: 8px 9px; background: rgba(var(--acc-rgb), .14); border-left: 3px solid var(--acc); cursor: pointer; transition: transform .12s, background .2s; min-width: 0; }

.jbig { display: grid; grid-template-columns: 86px 1fr auto; gap: 16px; align-items: start; cursor: pointer; }

.links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

/* ---------------------------------------------------------------- person page, estimate editor */
.phead { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.phead .avatar { width: 58px; height: 58px; border-radius: 16px; font-size: 20px; }

.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.sticky { position: sticky; top: 0; }
.lines-ed { display: flex; flex-direction: column; gap: 10px; }
.lrow { border: 1px solid var(--line); border-radius: 13px; padding: 11px; background: rgba(0,0,0,.14); display: grid; grid-template-columns: minmax(0, 1fr) 112px 92px 112px 34px; gap: 9px; align-items: start; }
.lrow .desc { grid-column: 1 / 5; }

.lrow .unit { font-size: 11.5px; color: var(--ink3); margin-top: 3px; }

/* in the side panel (jobs) lines stack like on a phone: service on its own row */

#sheet .lrow .svc, #sheet .lrow .desc { grid-column: 1 / -1; }

.presets { display: flex; gap: 6px; flex-wrap: wrap; }

.picker { position: relative; }
.picklist { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; max-height: 260px; overflow-y: auto; }

.who { display: flex; gap: 12px; align-items: center; }
.pre { white-space: pre-line; }

/* ---------------------------------------------------------------- sheet + toast */
#sheetWrap { position: fixed; inset: 0; z-index: 60; background: rgba(3,4,16,.55); backdrop-filter: blur(6px); display: flex; justify-content: flex-end;
  opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }

  display: flex; flex-direction: column; transform: translateX(30px); transition: transform .3s cubic-bezier(.2,.8,.2,1); box-shadow: -30px 0 70px rgba(0,0,0,.45); }

.sheethead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px 20px; border-bottom: 1px solid var(--line); }

  box-shadow: 0 16px 40px rgba(0,0,0,.45); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; font-weight: 600; max-width: calc(100vw - 32px); }

(() => {

const X = (() => { // Ben's own CRM (2026-11-21; docs/crm-plan.md). Shared like money_calc.js: the CRM website/app inlines it
// (app/build.py build_crm), cloud Jarvis imports it (tools_crmapp.ts), so the screen and Jarvis agree.

const TABLES = { people: "crm_people", services: "crm_services", estimates: "crm_estimates", plans: "crm_plans",

  people: ["id", "kind", "type", "first", "last", "company", "phones", "emails", "address", "city", "state", "zip", "notes", "source", "status", "created", "tcf", "edited"],

const HORIZON_DAYS = 730;    // a recurring plan keeps its visits scheduled this far ahead

// ------------------------------------------------------------------ small helpers
const round2 = (n) => Math.round((+n || 0) * 100) / 100;
const usd = (n, cents = false) => (n < 0 ? "-" : "") + "$" + Math.abs(+n || 0).toLocaleString("en-US",

const weekday = (iso) => new Date(iso + "T12:00:00Z").getUTCDay();   // 0 = Sunday

function nameOf(p) {
  if (!p) return "(unknown)";
  const full = [p.first, p.last].filter(Boolean).join(" ");
  if (p.company && full && !p.company.toLowerCase().includes(full.toLowerCase())) return `${p.company} (${full})`;
  return p.company || full || "(no name)";
}
const addressOf = (p) => p ? [p.address, [p.city, p.state].filter(Boolean).join(", "), p.zip].filter(Boolean).join(" ").replace(/\s+/g, " ").trim() : "";
const lineTotal = (l) => l.total != null && l.total !== "" && !Number.isNaN(+l.total) ? +l.total : round2((+l.rate || 0) * (l.qty === "" || l.qty == null ? 1 : +l.qty || 0));
const linesTotal = (lines) => round2((lines || []).reduce((s, l) => s + lineTotal(l), 0));
/** What an estimate is worth: the sum, or for "options" estimates the dearest option ({value, low, options}). */
function estimateValue(e) {
  const ts = (e.lines || []).map(lineTotal);
  if (!ts.length) return { value: 0, low: 0, options: false };
  if (e.options) return { value: Math.max(...ts), low: Math.min(...ts.filter((t) => t > 0).concat([Math.max(...ts)])), options: true };
  return { value: round2(ts.reduce((a, b) => a + b, 0)), low: 0, options: false };

const jobTotal = (j) => linesTotal(j.lines);
const serviceNames = (lines) => [...new Set((lines || []).map((l) => (l.service || "").trim()).filter(Boolean))];
const freqText = (p) => !p ? "" : p.unit === "week" ? (p.every === 1 ? "Every week" : `Every ${p.every} weeks`)
  : p.every === 1 ? "Every month" : p.every === 12 ? "Every year" : `Every ${p.every} months`;

function index(D) {

  const group = (rows, key) => { const m = new Map(); for (const r of rows) { const k = r[key]; if (!k) continue; (m.get(k) || m.set(k, []).get(k)).push(r); } return m; };

  for (const p of D.payments) paid.set(p.invoice, round2((paid.get(p.invoice) || 0) + (+p.amount || 0)));

const jobDays = (j) => [j.date, ...(Array.isArray(j.days) ? j.days : [])];

  const out = [];
  for (const j of I.jobsSorted) {
    if (j.status === "cancelled") continue;
    for (const d of jobDays(j)) if (d >= from && d <= to) out.push({ job: j, day: d, first: d === j.date });

  const busy = new Map();
  for (const x of jobsBetween(D, I, from, addDays(from, 120))) if (counts(x.job)) busy.set(x.day, (busy.get(x.day) || 0) + 1);

function dashboard(D, I, today) {
  const year = today.slice(0, 4), lastYear = String(+year - 1), sameDayLastYear = lastYear + today.slice(4);

  const unpaid = D.invoices.map((inv) => ({ inv, bal: balanceOf(I, inv), age: inv.date ? daysBetween(inv.date, today) : 0 }))

// ------------------------------------------------------------------ talking to cloud Jarvis
async function api(route, body = {}) {
  if (DEMO) return demoApi(route, JSON.parse(JSON.stringify(body)));
  const h = await authHeaders();
  if (!h) throw new Error("not paired");
  const r = await fetch(FN + "/crmapp/" + route, { method: "POST", headers: { "content-type": "application/json", ...h }, body: JSON.stringify({ tz: TZ, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { $("#gate").classList.add("on"); throw new Error("not paired"); }
  if (!r.ok) throw new Error(j.error || `The CRM couldn't be reached (${r.status}).`);
  return j;
}
function reindex() { I = X.index(D); }
function put(table, row) {
  const arr = D[table], i = arr.findIndex((r) => r.id === row.id);
  if (i >= 0) arr[i] = row; else arr.push(row);
}
async function save(table, row) {
  const { row: saved } = await api("save", { table, row });
  put(table, saved); reindex();
  return saved;
}
async function remove(table, id) {
  await api("delete", { table, id });
  if (table === "people") {
    const invs = D.invoices.filter((i) => i.person === id).map((i) => i.id);
    D.payments = D.payments.filter((p) => !invs.includes(p.invoice));
    for (const t of ["estimates", "jobs", "plans", "invoices"]) D[t] = D[t].filter((r) => r.person !== id);
  }
  if (table === "invoices") { D.payments = D.payments.filter((p) => p.invoice !== id); for (const j of D.jobs) if (j.invoice === id) j.invoice = null; }
  if (table === "plans") D.jobs = D.jobs.filter((j) => !(j.plan === id && j.status === "scheduled" && j.date >= TODAY));
  D[table] = D[table].filter((r) => r.id !== id);
  reindex();
}
async function savePlan(plan, from, anchor) {
  const r = await api("plan", { plan, from, anchor });
  put("plans", r.plan);
  D.jobs = D.jobs.filter((j) => !r.remove.includes(j.id)).concat(r.add);
  reindex();
  return r;
}
async function load() {
  const d = await api("data", {});
  D = { people: d.people, services: d.services, estimates: d.estimates, plans: d.plans, jobs: d.jobs, invoices: d.invoices, payments: d.payments, settings: d.settings || {} };
  if (d.today) TODAY = d.today;
  reindex();
}
let toastT = 0;
function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "on" + (err ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => (t.className = ""), err ? 5200 : 2600);
}
async function busy(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { console.error(e); toast(e.message || String(e), true); }
  finally { if (btn) btn.disabled = false; }
}

function dayMoney(day) { return X.moneyBetween(D, I, day, day); }

    <label class="f">Email<input name="${prefix}email" type="email" value="${esc((p.emails || [])[0] || "")}" autocomplete="off"></label>

    <label class="f">How they found you<input name="${prefix}source" value="${v("source")}" list="srcList"><datalist id="srcList">${sources.map((s) => `<option value="${esc(s)}">`).join("")}</datalist></label>
    <label class="f full">Notes<textarea name="${prefix}notes" rows="3">${v("notes")}</textarea></label></div>`;
}
function readPerson(root, base, prefix = "") {
  const g = (k) => ($(`[name="${prefix}${k}"]`, root)?.value ?? "").trim();
  const type = $("[data-ptype] .on", root)?.dataset.t || base.type || "residential";
  const phone = g("phone"), email = g("email");
  const phones = (base.phones || []).slice(); if (phone) { if (phones[0]) phones[0] = { ...phones[0], n: phone }; else phones.push({ n: phone, label: "mobile" }); } else phones.splice(0, 1);
  const emails = (base.emails || []).slice(); if (email) emails[0] = email; else emails.splice(0, 1);
  return { ...base, id: base.id || X.uuid(), kind: base.kind || "prospect", type, first: g("first"), last: g("last"), company: g("company"), phones, emails,
    address: g("address"), city: g("city"), state: g("state"), zip: g("zip"), source: g("source"), notes: g("notes"), status: base.status || "active", created: base.created || TODAY };
}
function segWire(root) { for (const s of $$("[data-ptype]", root)) s.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $$("button", s).forEach((x) => x.classList.toggle("on", x === b)); }; }
function personSheet(p) {
  const isNew = !p.id;
  openSheet(isNew ? `New ${p.kind || "customer"}` : "Edit " + X.nameOf(p), personFields(p) + `<div class="sheetfoot"><button class="btn" id="pc">Cancel</button><button class="btn primary" id="ps">Save</button></div>`, (b) => {
    segWire(b);
    $("#pc", b).onclick = () => closeSheet();
    $("#ps", b).onclick = (e) => busy(e.target, async () => {
      const row = readPerson(b, p);
      if (!row.first && !row.last && !row.company) throw new Error("Give them a name first.");
      await save("people", row);
      toast("Saved.");
      if (isNew) leaveSheet("person/" + row.id); else { closeSheet(); render(); }
    });
  });
}

// ------------------------------------------------------------------ lines editor (estimates, invoices, jobs)
function linesEditor(host, lines, onChange) {
  const presets = presetOptions();
  const draw = () => {
    host.innerHTML = `<div class="lhead"><span>Service</span><span class="n">Price per</span><span class="n">Amount</span><span class="n">Total</span><span></span></div>
      <div class="lines-ed">${lines.map((l, i) => `<div class="lrow" data-i="${i}">
        <label class="f svc"><span class="show-phone">Service</span><input class="inp" data-k="service" value="${esc(l.service)}" list="presetList" placeholder="What you'll do"></label>
        <label class="f"><span class="show-phone">Price per</span><input class="inp" data-k="rate" value="${l.rate === "" || l.rate == null ? "" : +l.rate}" inputmode="decimal" style="text-align:right" placeholder="0.00"></label>
        <label class="f"><span class="show-phone">Amount</span><input class="inp" data-k="qty" value="${l.qty === "" || l.qty == null ? "" : +l.qty}" inputmode="decimal" style="text-align:right" placeholder="1">${l.unit ? `<span class="unit">${esc(l.unit)}</span>` : ""}</label>
        <div class="ltot">${money(X.lineTotal(l))}</div>
        <button type="button" class="iconbtn x" data-del="${i}" aria-label="Remove line">${ic("x")}</button>
        <label class="f desc"><textarea class="inp" data-k="description" rows="${Math.min(8, Math.max(2, String(l.description || "").split("\n").length))}" placeholder="Description the customer sees">${esc(l.description)}</textarea></label></div>`).join("")}</div>
      <datalist id="presetList">${presets.map((s) => `<option value="${esc(s.name)}">`).join("")}</datalist>
      <div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-addline>${ic("plus")}Blank line</button><span class="muted small">or add a preset:</span></div>
      <div class="presets" style="margin-top:8px">${presets.map((s) => `<button type="button" class="chip" data-preset="${s.id}">${esc(s.name)}${s.rate ? ` <span class="n">${money(s.rate)}${s.unit ? " " + esc(s.unit) : ""}</span>` : ""}</button>`).join("")}</div>`;
    paintIcons(host);
  };
  const fixTotals = () => { for (const row of $$(".lrow", host)) { const l = lines[+row.dataset.i]; $(".ltot", row).textContent = money(X.lineTotal(l)); } };
  host.oninput = (e) => {
    const inp = e.target.closest("[data-k]"); if (!inp) return;
    const l = lines[+inp.closest(".lrow").dataset.i], k = inp.dataset.k;
    if (k === "rate" || k === "qty") l[k] = inp.value.replace(/[^0-9.\-]/g, "") === "" ? "" : parseFloat(inp.value.replace(/[^0-9.\-]/g, "")) || 0;
    else l[k] = inp.value;
    delete l.total;   // the total follows price x amount once Ben edits a line
    if (k === "description") inp.rows = Math.min(8, Math.max(2, inp.value.split("\n").length));
    fixTotals(); onChange();
  };
  host.addEventListener("change", (e) => {   // picking a preset name in a blank line fills its description and price
    const inp = e.target.closest('[data-k="service"]'); if (!inp) return;
    const l = lines[+inp.closest(".lrow").dataset.i], s = presets.find((x) => x.name.toLowerCase() === inp.value.trim().toLowerCase());
    if (s && !String(l.description || "").trim()) { l.description = s.description || ""; if (l.rate === "" || l.rate == null || +l.rate === 0) l.rate = +s.rate || 0; l.unit = s.unit || ""; draw(); onChange(); }
  });
  host.onclick = (e) => {
    const d = e.target.closest("[data-del]"); if (d) { lines.splice(+d.dataset.del, 1); draw(); onChange(); return; }
    if (e.target.closest("[data-addline]")) { lines.push({ service: "", description: "", rate: "", qty: 1 }); draw(); onChange(); $$(".lrow", host).pop()?.querySelector("input")?.focus(); return; }
    const pr = e.target.closest("[data-preset]");
    if (pr) { const s = I.services.get(pr.dataset.preset);
      if (lines.length && !lines.some((l) => String(l.service || "").trim() || String(l.description || "").trim() || +l.rate)) lines.length = 0;   // replace the empty starter line
      lines.push({ service: s.name, description: s.description || "", rate: +s.rate || 0, qty: 1, unit: s.unit || "" });
      draw(); onChange(); const q = $$(".lrow", host).pop()?.querySelector('[data-k="qty"]'); if (q) { q.focus(); q.select(); } }
  };
  draw();
  return { redraw: draw };
}
const cleanLines = (lines) => lines.filter((l) => String(l.service || "").trim() || String(l.description || "").trim() || +l.rate)
  .map((l) => { const o = { service: String(l.service || "").trim(), description: String(l.description || "").trim(), rate: +l.rate || 0, qty: l.qty === "" || l.qty == null ? 1 : +l.qty || 0 };
    if (l.unit) o.unit = l.unit; o.total = l.total != null && l.total !== "" ? +l.total : X.round2(o.rate * o.qty); if (l.to) o.to = l.to; return o; });

// customer picker (estimates, invoices, jobs): pick someone, or type a new one in
function personPicker(host, state, onChange, kind = "prospect") {
  const draw = () => {
    const p = state.person && I.people.get(state.person);
    if (p) {
      host.innerHTML = `<div class="who"><div class="avatar ${p.type === "commercial" ? "com" : ""}">${esc(initials(p))}</div><div class="main" style="flex:1;min-width:0"><div class="t1"><b>${esc(X.nameOf(p))}</b> <span class="badge ${p.kind === "prospect" ? "acc" : "good"}">${p.kind}</span></div>
        <div class="small muted">${esc(X.addressOf(p) || "No address")} ${(p.phones || [])[0] ? " · " + esc(p.phones[0].n) : ""}</div></div><button type="button" class="btn sm" data-change>Change</button></div>`;
    } else if (state.newPerson) {
      host.innerHTML = personFields(state.newPerson, "np_") + `<div class="row" style="margin-top:8px"><button type="button" class="btn sm ghost" data-existing>Pick someone already in the CRM instead</button></div>`;
      segWire(host);
    } else {
      host.innerHTML = `<input class="inp" data-pq placeholder="Search a name, street or phone…" autocomplete="off"><div class="picklist" data-pl hidden></div>
        <div class="row" style="margin-top:10px"><button type="button" class="btn sm primary" data-new>${ic("plus")}Someone new</button><span class="small muted">(a door you just knocked)</span></div>`;
    }
    paintIcons(host);
  };
  host.addEventListener("click", (e) => {
    if (e.target.closest("[data-change]")) { state.person = null; draw(); onChange(); setTimeout(() => $("[data-pq]", host)?.focus(), 30); }
    else if (e.target.closest("[data-new]")) { state.newPerson = { kind, type: "residential", state: "UT" }; draw(); onChange(); $('[name="np_first"]', host)?.focus(); }
    else if (e.target.closest("[data-existing]")) { state.newPerson = null; draw(); onChange(); }
    else { const it = e.target.closest("[data-pick]"); if (it) { state.person = it.dataset.pick; state.newPerson = null; draw(); onChange(); } }
  });
  host.addEventListener("input", (e) => {
    if (e.target.matches("[data-pq]")) {
      const q = e.target.value.trim(), pl = $("[data-pl]", host);
      const res = q ? X.search(D, I, q, 8).people : [];
      pl.hidden = !q;
      pl.innerHTML = res.map((p) => `<div class="li" data-pick="${p.id}"><div class="avatar ${p.type === "commercial" ? "com" : ""}">${esc(initials(p))}</div><div class="main"><div class="t">${esc(X.nameOf(p))}</div><div class="s">${esc(X.addressOf(p))}</div></div><span class="badge ${p.kind === "prospect" ? "acc" : "good"}">${p.kind}</span></div>`).join("")
        || `<div class="empty">No one called “${esc(q)}”. Add them as someone new.</div>`;
    } else onChange();
  });
  draw();
  return {
    redraw: draw,
    async resolve() {   // -> person id (saves a new person first)
      if (state.person) return state.person;
      if (!state.newPerson) throw new Error("Pick who this is for.");
      const row = readPerson(host, state.newPerson, "np_");
      if (!row.first && !row.last && !row.company) throw new Error("Give the new person a name.");
      await save("people", row);
      state.person = row.id; state.newPerson = null;
      return row.id;
    },
  };
}

function newJob(o) {
  const person = o.person && I.people.get(o.person);
  let lines = o.lines;
  if (!lines && person) {   // their usual services: the latest job's lines
    const last = X.lastJob(I, person.id, TODAY) || X.nextJob(I, person.id, TODAY);
    lines = last ? last.lines.map((l) => ({ ...l })) : [];
  }
  jobSheet({ id: X.uuid(), person: o.person || null, date: o.date || TODAY, days: null, time: "", lines: lines || [], status: "scheduled", plan: null, estimate: o.estimate || null, invoice: null, notes: o.note || "" }, true, o.optionsFrom);
}

    <div class="row"><span class="muted">Job total</span><div class="spacer"></div><b id="jtot" style="font-size:20px"></b></div>
    <div id="scope" hidden class="card"><h3>Change which visits?</h3><div class="row"><button class="btn" data-scope="one">Only this visit</button><button class="btn primary" data-scope="future">This and all future visits</button></div></div>
    <div class="sheetfoot">
      ${isNew ? "" : `${j.status !== "done" ? `<button class="btn good" id="jdone">${ic("check")}Mark done</button>` : `<button class="btn" id="jundo">Not done</button>`}
        ${inv ? `<button class="btn" id="jinv">${ic("receipt")}Invoice #${esc(inv.number)}</button>` : `<button class="btn" id="jmkinv">${ic("receipt")}Create invoice</button>`}
        ${j.status === "scheduled" ? `<button class="btn" id="jskip">Skip</button>` : ""}<button class="btn bad" id="jdel">${ic("trash")}</button>`}
      <div class="spacer"></div><button class="btn primary" id="jsave">${ic("check")}${isNew ? "Book job" : "Save"}</button></div>`, (b) => {

    $("#jwho", b).addEventListener("click", () => setTimeout(() => {   // picking someone with no lines yet fills in their usual services
      if (state.person && !cleanLines(j.lines).length) { const last = X.lastJob(I, state.person, TODAY); if (last) { j.lines.splice(0, j.lines.length, ...last.lines.map((l) => ({ ...l }))); ed.redraw(); tot(); } }
    }, 0));
    for (const c of $$("[data-opt]", b)) c.onclick = () => { const l = optionsFrom.lines[+c.dataset.opt]; j.lines.splice(0, j.lines.length, { ...l }); ed.redraw(); tot(); $$("[data-opt]", b).forEach((x) => x.classList.toggle("on", x === c)); };

      const lines = cleanLines(j.lines);
      if (!lines.length) throw new Error("Add what you'll be doing.");

    $("#jsave", b).onclick = (ev) => busy(ev.currentTarget, async () => {

          const pl = { id: X.uuid(), person: row.person, every: f.every, unit: f.unit, start: row.date, time: row.time, lines: row.lines, active: true, notes: "" };
          if (!isNew) { await saveOne({ ...row, plan: pl.id }); await savePlan(pl, X.addDays(row.date, 1), row.date); }
          else await savePlan(pl, row.date, row.date);

          return finish(`Booked: ${X.freqText(f).toLowerCase()} from ${X.niceDate(row.date)}.`);
        }
        await saveOne(row);
        return finish(isNew ? `Booked ${X.niceDate(row.date)}.` : "Saved.");
      }
      // a visit of a recurring plan: ask whether the change is for this visit only or from here on
      const sameSchedule = f && f.every === plan.every && f.unit === plan.unit;

      $("#scope", b).hidden = false; $("#scope", b).scrollIntoView({ behavior: "smooth", block: "nearest" });

          if (!f) { await saveOne(row); await savePlan({ ...plan, active: false }, X.addDays(row.date, 1), row.date); return finish("Schedule stopped after this visit."); }
          await savePlan({ ...plan, every: f.every, unit: f.unit, time: row.time, lines: row.lines }, row.date < job.date ? row.date : job.date, row.date);

}
function to24(t) {
  const m = String(t || "").match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return "";
  let h = +m[1]; if (m[3]) { if (/pm/i.test(m[3]) && h < 12) h += 12; if (/am/i.test(m[3]) && h === 12) h = 0; }
  return String(h).padStart(2, "0") + ":" + m[2];
}
function from24(v) {
  if (!v) return "";
  const [h, m] = v.split(":").map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
}

    <div class="full"><div class="small muted" style="margin-bottom:6px;font-weight:650">PAID BY</div><div class="chips" id="pm">${X.METHODS.filter((m) => m !== "credit").map((m, i) => `<button type="button" class="chip ${i === 1 ? "on" : ""}" data-m="${m}">${m}</button>`).join("")}</div></div>
    <label class="f full">Note (check number, etc.)<input id="pn"></label></div>
    <div class="sheetfoot"><button class="btn" id="pc">Cancel</button><button class="btn primary" id="ps">${ic("check")}Record payment</button></div>`, (b) => {
    $("#pm", b).onclick = (e) => { const c = e.target.closest("[data-m]"); if (c) $$("[data-m]", b).forEach((x) => x.classList.toggle("on", x === c)); };

  const svcs = D.services.slice().sort((a, b) => a.position - b.position);

    <div class="card"><h3>Service presets <span class="right">used on estimates, jobs and invoices</span></h3>
      <div class="list" id="svcs">${svcs.map((s, i) => `<div class="li" data-svc="${s.id}" style="${s.archived ? "opacity:.5" : ""}"><div class="main"><div class="t">${esc(s.name)} ${s.archived ? '<span class="badge">hidden</span>' : ""}</div>
        <div class="s">${s.rate ? money(s.rate) + (s.unit ? " " + esc(s.unit) : "") + " · " : ""}${esc((s.description || "").replace(/\n+/g, " ").slice(0, 110))}</div></div>

function serviceSheet(s, isNew = false) {
  openSheet(isNew ? "New preset" : "Edit preset", `<div class="fgrid"><label class="f full">Service name<input id="sn" value="${esc(s.name)}" placeholder="Exterior Window Cleaning"></label>

    <label class="f">Per what<input id="su" value="${esc(s.unit || "")}" list="unitList" placeholder="per pane"><datalist id="unitList">${["per pane", "per window", "per screen", "per panel", "per job", "per hour", "per foot", "each"].map((u) => `<option value="${u}">`).join("")}</datalist></label>
    <label class="f full">Description (the customer sees this)<textarea id="sd" rows="10">${esc(s.description || "")}</textarea></label></div>
    <div class="sheetfoot">${isNew ? "" : `<button class="btn" id="sh">${s.archived ? "Show again" : "Hide"}</button><button class="btn bad" id="sx">${ic("trash")}</button>`}<div class="spacer"></div><button class="btn primary" id="ss">Save</button></div>`, (b) => {
    $("#ss", b).onclick = (e) => busy(e.currentTarget, async () => {
      const row = { ...s, name: $("#sn", b).value.trim(), rate: parseFloat($("#sr", b).value) || 0, unit: $("#su", b).value.trim(), description: $("#sd", b).value.trim() };
      if (!row.name) throw new Error("Give the preset a name.");
      await save("services", row); toast("Saved."); closeSheet(); render();
    });
    if ($("#sh", b)) $("#sh", b).onclick = (e) => busy(e.currentTarget, async () => { await save("services", { ...s, archived: !s.archived }); closeSheet(); render(); });
    if ($("#sx", b)) $("#sx", b).onclick = (e) => { if (!confirm(`Delete the preset “${s.name}”? Estimates that used it keep their lines.`)) return; busy(e.currentTarget, async () => { await remove("services", s.id); closeSheet(); render(); }); };
  });
}

let demoDb = null;
function demoApi(route, b) {
  if (!demoDb) demoDb = demoData();
  const DB = demoDb;
  if (route === "data") return JSON.parse(JSON.stringify(DB));
  if (route === "save") { const arr = DB[b.table], i = arr.findIndex((r) => r.id === b.row.id); if (i >= 0) arr[i] = b.row; else arr.push(b.row); return { row: JSON.parse(JSON.stringify(b.row)) }; }
  if (route === "delete") {
    if (b.table === "people") { for (const t of ["estimates", "jobs", "plans", "invoices"]) DB[t] = DB[t].filter((r) => r.person !== b.id); }
    if (b.table === "plans") DB.jobs = DB.jobs.filter((j) => !(j.plan === b.id && j.status === "scheduled" && j.date >= TODAY));
    DB[b.table] = DB[b.table].filter((r) => r.id !== b.id); return { ok: true };
  }
  if (route === "plan") {
    const i = DB.plans.findIndex((p) => p.id === b.plan.id); if (i >= 0) DB.plans[i] = b.plan; else DB.plans.push(b.plan);
    const r = X.regenPlan(b.plan, DB.jobs, b.from, b.anchor, TODAY);
    DB.jobs = DB.jobs.filter((j) => !r.remove.includes(j.id)).concat(r.add);
    return { plan: b.plan, remove: r.remove, add: JSON.parse(JSON.stringify(r.add)) };
  }
  if (route === "settings") { if (b.settings) DB.settings = { ...DB.settings, ...b.settings }; return { settings: DB.settings }; }
  if (route === "import") return { counts: { people: 0, jobs: 0, estimates: 0, invoices: 0 } };
  throw new Error("Not in the demo.");
}
