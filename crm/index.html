/* VITRA CRM (2026-11-21), design pass: a calm, professional business look in the colours Ben picked in
   Jarvis (app/themes.css, Settings > Colours). Accent = --th-a, second accent = --th-a2, highlight = --th-core1.
   Rules: sentence-case headings, one accent per element, numbers in tabular figures, motion only on
   transform/opacity, no infinite animations on repeated items (phones: see CLAUDE.md "Phone glitch"). */
:root {
  --acc: var(--th-a-hex, #ff4fb8); --acc-rgb: var(--th-a, 255,79,184); --acc2: rgb(var(--th-a2, 155,107,255)); --acc2-rgb: var(--th-a2, 155,107,255);
  --core: rgb(var(--th-core1, 79,216,255)); --core-rgb: var(--th-core1, 79,216,255);
  --ink: #f4f6fc; --ink2: var(--th-ink2, #c9d6ee); --ink3: var(--th-ink3, #9eb0d4);
  --line: rgba(255,255,255,.075); --line2: rgba(255,255,255,.13); --lineacc: rgba(var(--acc-rgb), .35);
  --surf: rgba(var(--th-c2, 30,42,92), .42); --surf2: rgba(var(--th-c1, 64,52,130), .28); --raise: rgba(255,255,255,.035);
  --solid: var(--th-s2, #151a42); --solid2: var(--th-s1, #232056); --input: rgba(var(--th-input, 12,14,46), .6);
  --good: #34d399; --warn: #fbbf24; --bad: #fb7185;
  --r: 14px; --r2: 10px; --side: 248px; --top: 64px;
  --sh1: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.18);
  --sh2: 0 2px 6px rgba(0,0,0,.3), 0 24px 60px rgba(0,0,0,.4);
  --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 var(--font); color: var(--ink); letter-spacing: -.003em; font-feature-settings: "cv11", "ss01";
  background: var(--th-bgB, #101636);
  background: radial-gradient(900px 520px at 100% -8%, rgba(var(--acc-rgb), .09), transparent 62%),
              radial-gradient(800px 520px at -6% 108%, rgba(var(--core-rgb), .07), transparent 60%),
              linear-gradient(180deg, var(--th-bgA, #171a46), var(--th-bgB, #101636)) fixed;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
::selection { background: rgba(var(--acc-rgb), .35); }
:focus-visible { outline: 2px solid rgba(var(--acc-rgb), .8); outline-offset: 2px; border-radius: 6px; }
i[data-icon] { display: inline-flex; width: 18px; height: 18px; flex: none; }
i[data-icon] svg { width: 100%; height: 100%; }
.num, td.n, .money, .amt, .tot b, .kpi .value { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,.18); }

/* ---------------------------------------------------------------- frame */
#app { display: grid; grid-template-columns: var(--side) 1fr; grid-template-rows: minmax(0, 1fr); height: 100%; }
#side { display: flex; flex-direction: column; gap: 2px; padding: 18px 14px 14px; border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(var(--th-c1, 64,52,130), .22), rgba(0,0,0,.18)); overflow-y: auto; z-index: 30; }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 18px; }
.brand .mark { width: 46px; aspect-ratio: 420 / 333; position: relative; flex: none; filter: drop-shadow(0 2px 8px rgba(var(--acc-rgb), .35)); }
.brand .mark i { position: absolute; inset: 0; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
.brand .words { display: flex; flex-direction: column; line-height: 1.15; }
.brand .words b { font-weight: 800; letter-spacing: .18em; font-size: 15px; }
.brand .words small { color: var(--ink3); font-size: 11px; font-weight: 600; letter-spacing: .04em; }
.logo { font-weight: 800; letter-spacing: .2em; font-size: 20px; color: var(--ink); }
.navsec { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); opacity: .75; padding: 14px 12px 6px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
.navi { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 11px; border-radius: 10px; color: var(--ink2); font-weight: 550; font-size: 13.5px; position: relative; transition: background .15s, color .15s; }
.navi:hover { background: rgba(255,255,255,.045); color: var(--ink); }
.navi.cur { color: var(--ink); background: rgba(var(--acc-rgb), .13); }
.navi.cur::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acc); box-shadow: 0 0 12px rgba(var(--acc-rgb), .7); }
.navi.cur i { color: var(--acc); }
.navi i { color: var(--ink3); }
.navi .badge { margin-left: auto; }
.sidefoot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 12px; }
.me { display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 8px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); }
.me .avatar { width: 32px; height: 32px; border-radius: 9px; font-size: 12px; }
.me b { display: block; font-size: 13px; font-weight: 600; }
.me small { color: var(--ink3); font-size: 11.5px; }
#scrim { display: none; }
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; overflow: hidden; }
#top { height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 1px solid var(--line);
  background: rgba(var(--th-nav, 26,26,70), .35); position: relative; z-index: 20; flex: none; }
#top h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
#menuBtn, #searchBtn { display: none; }
#searchWrap { position: relative; flex: 1; max-width: 460px; margin-left: auto; display: flex; align-items: center; }
#searchWrap > i { position: absolute; left: 12px; color: var(--ink3); pointer-events: none; width: 16px; height: 16px; }
#search { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line2); background: var(--input); padding: 0 44px 0 36px; outline: none; transition: border .15s, box-shadow .15s, background .15s; font-size: 13.5px; }
#search::placeholder { color: var(--ink3); }
#search:focus { border-color: rgba(var(--acc-rgb), .55); box-shadow: 0 0 0 4px rgba(var(--acc-rgb), .12); }
#searchWrap .kbd { position: absolute; right: 9px; pointer-events: none; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line2); border-bottom-width: 2px; font-size: 11px; font-weight: 600; color: var(--ink3); background: rgba(255,255,255,.03); }
#searchDrop { position: absolute; top: 45px; left: 0; right: 0; background: var(--solid); border: 1px solid var(--line2); border-radius: 14px;
  box-shadow: var(--sh2); max-height: 62vh; overflow-y: auto; padding: 6px; opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .15s, transform .15s var(--ease), visibility 0s .15s; }
#searchDrop.on { opacity: 1; visibility: visible; transform: none; transition: opacity .15s, transform .15s var(--ease); }
.sgroup { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); padding: 9px 10px 4px; }
.sitem { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 13.5px; }
.sitem:hover, .sitem.sel { background: rgba(var(--acc-rgb), .12); }
.sitem small { color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
.newwrap { position: relative; }
#newMenu { position: absolute; right: 0; top: 46px; min-width: 230px; background: var(--solid); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--sh2); padding: 6px;
  opacity: 0; visibility: hidden; transform: translateY(-4px) scale(.98); transform-origin: top right; transition: opacity .15s, transform .15s var(--ease), visibility 0s .15s; z-index: 40; }
#newMenu.on { opacity: 1; visibility: visible; transform: none; transition: opacity .15s, transform .15s var(--ease); }
.mi { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; cursor: pointer; width: 100%; border: 0; background: none; text-align: left; font-weight: 550; }
.mi:hover { background: rgba(var(--acc-rgb), .12); }
.mi i { width: 30px; height: 30px; padding: 6px; border-radius: 8px; background: rgba(var(--acc-rgb), .14); color: var(--acc); }
.mi small { display: block; color: var(--ink3); font-weight: 500; font-size: 12px; }
#view { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 28px 48px; outline: none; }
#view > .fade { animation: fadein .28s var(--ease); }
@keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
#bottom { display: none; }
.wrap { max-width: 1320px; margin: 0 auto; }

/* ---------------------------------------------------------------- building blocks */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: var(--r2); border: 1px solid var(--line2);
  background: rgba(255,255,255,.045); cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; color: var(--ink);
  transition: transform .1s, background .15s, box-shadow .15s, border-color .15s; }
.btn i[data-icon] { width: 16px; height: 16px; }
.btn:hover { background: rgba(255,255,255,.085); border-color: rgba(255,255,255,.2); }
.btn:active { transform: translateY(1px); }
.btn.primary { border: 0; color: var(--th-on, #fff); background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0)) , var(--acc);
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 6px 18px rgba(var(--acc-rgb), .32); }
.btn.primary:hover { box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 8px 24px rgba(var(--acc-rgb), .45); filter: brightness(1.05); }
.btn.good { border-color: rgba(52,211,153,.4); color: var(--good); background: rgba(52,211,153,.07); }
.btn.good:hover { background: rgba(52,211,153,.14); }
.btn.bad { border-color: rgba(251,113,133,.38); color: var(--bad); background: rgba(251,113,133,.06); }
.btn.bad:hover { background: rgba(251,113,133,.13); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; gap: 5px; }
.btn.sm i[data-icon] { width: 14px; height: 14px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: rgba(255,255,255,.06); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.iconbtn { width: 36px; height: 36px; border-radius: var(--r2); border: 1px solid transparent; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink2); transition: background .15s, color .15s; }
.iconbtn:hover { background: rgba(255,255,255,.07); color: var(--ink); }
.iconbtn[disabled] { opacity: .3; pointer-events: none; }
.card { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; position: relative; min-width: 0;
  box-shadow: var(--sh1), inset 0 1px 0 rgba(255,255,255,.04); }
.card h3 { margin: 0 0 14px; font-size: 14px; font-weight: 650; letter-spacing: -.005em; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.card h3 i[data-icon] { width: 16px; height: 16px; color: var(--ink3); }
.card h3 .right { margin-left: auto; font-weight: 550; color: var(--ink3); font-size: 12.5px; }
.card h3 a.right { color: var(--ink2); }
.card h3 a.right:hover { color: var(--acc); }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.muted { color: var(--ink3); }
.small { font-size: 12.5px; }
.kpi { padding: 18px 18px 16px; overflow: hidden; }
.kpi .label { font-size: 12.5px; color: var(--ink2); font-weight: 550; display: flex; align-items: center; gap: 7px; }
.kpi .label i { width: 26px; height: 26px; padding: 5px; border-radius: 8px; background: rgba(var(--acc-rgb), .14); color: var(--acc); }
.kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -.025em; margin: 12px 0 4px; line-height: 1.1; }
.kpi .value small { font-size: 15px; font-weight: 600; color: var(--ink3); letter-spacing: 0; }
.kpi .sub { font-size: 12.5px; color: var(--ink3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi .spark { position: absolute; right: 14px; top: 18px; width: 92px; height: 34px; opacity: .9; }
.kpi .ic { display: none; }
.kpi.link { cursor: pointer; transition: transform .15s var(--ease), border-color .15s, box-shadow .15s; }
.kpi.link:hover { transform: translateY(-2px); border-color: var(--lineacc); box-shadow: var(--sh2); }
.delta { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 99px; font-size: 11.5px; font-weight: 650; }
.delta.up { background: rgba(52,211,153,.14); color: var(--good); }
.delta.down { background: rgba(251,113,133,.14); color: var(--bad); }
.up { color: var(--good); } .down { color: var(--bad); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: rgba(255,255,255,.07); color: var(--ink2); border: 1px solid rgba(255,255,255,.06); }
.badge i[data-icon] { width: 12px; height: 12px; }
.badge[hidden] { display: none; }
.badge.acc { background: rgba(var(--acc-rgb), .14); color: var(--th-soft, #ff8fd6); border-color: rgba(var(--acc-rgb), .22); }
.badge.core { background: rgba(var(--core-rgb), .12); color: var(--core); border-color: rgba(var(--core-rgb), .2); }
.badge.good { background: rgba(52,211,153,.12); color: var(--good); border-color: rgba(52,211,153,.2); }
.badge.warn { background: rgba(251,191,36,.12); color: var(--warn); border-color: rgba(251,191,36,.2); }
.badge.bad { background: rgba(251,113,133,.12); color: var(--bad); border-color: rgba(251,113,133,.2); }
.badge.good::before, .badge.warn::before, .badge.bad::before, .badge.acc::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line2); background: transparent; cursor: pointer; font-weight: 550; font-size: 13px; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s, border-color .15s; }
.chip:hover { color: var(--ink); background: rgba(255,255,255,.04); }
.chip.on { color: var(--ink); background: rgba(var(--acc-rgb), .16); border-color: rgba(var(--acc-rgb), .5); }
.chip .n { color: var(--ink3); font-weight: 600; font-size: 12px; }
.chip.on .n { color: var(--th-soft, #ff8fd6); }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(0,0,0,.22); border: 1px solid var(--line); }
.seg button { height: 30px; padding: 0 13px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink3); transition: color .15s, background .15s; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08); }
.empty { text-align: center; color: var(--ink3); padding: 28px 12px; font-size: 13px; }
.empty b { display: block; color: var(--ink2); font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.empty .eic { width: 42px; height: 42px; margin: 0 auto 10px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(var(--acc-rgb), .1); color: var(--acc); }
.empty .eic i { width: 20px; height: 20px; }
.empty .btn { margin-top: 12px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .search2 { height: 34px; border-radius: 9px; border: 1px solid var(--line2); background: var(--input); padding: 0 12px; min-width: 240px; outline: none; font-size: 13px; transition: border .15s, box-shadow .15s; }
.toolbar .search2:focus { border-color: rgba(var(--acc-rgb), .55); box-shadow: 0 0 0 4px rgba(var(--acc-rgb), .12); }
.pagehead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.pagehead h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.025em; }
.pagehead .sub { color: var(--ink3); margin-top: 3px; }

/* forms */
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 550; color: var(--ink2); min-width: 0; }
.inp, label.f input, label.f select, label.f textarea { width: 100%; min-height: 38px; border-radius: 9px; border: 1px solid var(--line2); background: var(--input); padding: 8px 11px; outline: none; color: var(--ink); font-size: 14px; transition: border .15s, box-shadow .15s; }
.inp::placeholder, label.f input::placeholder, label.f textarea::placeholder { color: var(--ink3); opacity: .8; }
.inp:focus, label.f input:focus, label.f select:focus, label.f textarea:focus { border-color: rgba(var(--acc-rgb), .55); box-shadow: 0 0 0 4px rgba(var(--acc-rgb), .12); }
input[type="date"], input[type="time"] { color-scheme: dark; }
textarea { resize: vertical; line-height: 1.5; }
select option { background: var(--solid); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }
.check { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 550; color: var(--ink2); font-size: 13px; }
.check input { appearance: none; width: 36px; height: 20px; border-radius: 99px; background: rgba(255,255,255,.14); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.check input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.check input:checked { background: var(--acc); }
.check input:checked::before { transform: translateX(16px); }

/* lists / tables */
.list { display: flex; flex-direction: column; margin: 0 -8px; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 10px; cursor: pointer; min-width: 0; transition: background .12s; }
.li + .li { box-shadow: 0 -1px 0 var(--line); }
.li:hover { background: rgba(255,255,255,.035); box-shadow: none; }
.li:hover + .li { box-shadow: none; }
.li .main { flex: 1; min-width: 0; }
.li .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.li .s { color: var(--ink3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .amt { font-weight: 650; text-align: right; white-space: nowrap; font-size: 13.5px; }
.li .amt small { display: block; font-weight: 500; color: var(--ink3); font-size: 11.5px; }
.avatar { width: 34px; height: 34px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 650; font-size: 12px; letter-spacing: .02em;
  color: #fff; background: hsl(var(--h, 320) 48% 44%); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -8px 16px rgba(0,0,0,.18); }
.avatar.com { border-radius: 8px; }
.avatar i[data-icon] { width: 16px; height: 16px; }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; }
table.t th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink3); padding: 0 12px 10px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
table.t td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click td { transition: background .12s; }
table.t tr.click:hover td { background: rgba(255,255,255,.03); }
table.t tr.click:hover td:first-child { box-shadow: inset 2px 0 0 var(--acc); }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t .t1 { font-weight: 600; }
table.t .t2 { color: var(--ink3); font-size: 12.5px; }
.tablewrap { overflow-x: auto; margin: 0 -8px; }
.card > .tablewrap:first-child { margin-top: -4px; }
.actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

/* charts */
.chart { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 6px; }
.yaxis { position: relative; height: 200px; margin-top: 10px; }
.yaxis span { position: absolute; right: 0; transform: translateY(50%); font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.gridlines { position: absolute; left: 50px; right: 0; top: 10px; height: 200px; pointer-events: none; }
.gridlines i { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255,255,255,.07); }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 222px; padding-top: 10px; position: relative; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; position: relative; cursor: default; }
.bar .stackb { width: 100%; max-width: 36px; display: flex; flex-direction: column-reverse; justify-content: flex-start; height: 200px; position: relative; }
.bar .fill { width: 100%; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--acc), rgba(var(--acc-rgb), .55)); min-height: 2px; transition: filter .15s; transform-origin: bottom; animation: grow .7s var(--ease) both; }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
.bar:hover .fill { filter: brightness(1.15); }
.bar .fill.booked { background: repeating-linear-gradient(135deg, rgba(var(--core-rgb), .55) 0 4px, rgba(var(--core-rgb), .22) 4px 8px); border-radius: 6px 6px 0 0; }
.bar .ghost { position: absolute; left: 50%; transform: translateX(-50%); width: 120%; max-width: 44px; border-top: 2px solid rgba(255,255,255,.28); pointer-events: none; }
.bar .m { font-size: 11px; color: var(--ink3); font-weight: 550; height: 16px; }
.bar.now .m { color: var(--ink); font-weight: 700; }
.bar .tip { position: absolute; bottom: calc(100% - 10px); left: 50%; transform: translate(-50%, 4px); background: var(--solid); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s; z-index: 5; box-shadow: var(--sh2); }
.bar:hover .tip { opacity: 1; transform: translate(-50%, 0); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink3); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ringwrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.ring { width: 140px; height: 140px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .arc { animation: ringin 1s var(--ease) both; }
@keyframes ringin { from { stroke-dasharray: 0 999; } }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .mid b { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.ring .mid small { color: var(--ink3); font-size: 11.5px; }
.meter { height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.meter > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--core), var(--acc)); }
.split { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 190px; }
.split .rowx { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
.split .rowx span { display: inline-flex; align-items: center; gap: 7px; }
.split .rowx i.sw { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.aging { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.aging div { background: rgba(0,0,0,.18); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.aging small { color: var(--ink3); font-size: 11px; display: block; }
.aging b { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- calendar */
.calbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.calbar h2 { margin: 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; min-width: 0; }
.navgrp { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.navgrp > * { border: 0 !important; border-radius: 0 !important; height: 34px; }
.navgrp > * + * { border-left: 1px solid var(--line2) !important; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tot { background: var(--surf); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--sh1); }
.tot small { display: block; color: var(--ink3); font-size: 12px; font-weight: 550; }
.tot b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.tot.main { background: linear-gradient(135deg, rgba(var(--acc-rgb), .2), rgba(var(--acc-rgb), .05)); border-color: rgba(var(--acc-rgb), .3); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 92px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surf); box-shadow: var(--sh1); }

  display: flex; flex-direction: column; transform: translateX(24px); transition: transform .3s var(--ease); box-shadow: var(--sh2); }

}

  #view { padding: 16px 16px calc(92px + env(safe-area-inset-bottom)); }
  #bottom { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    background: var(--solid); border-top: 1px solid var(--line2); }
  #bottom a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px 4px; border-radius: 11px; font-size: 10.5px; font-weight: 600; color: var(--ink3); }

  if (DEMO) return group === "books" ? demoBooks(route, JSON.parse(JSON.stringify(body))) : group === "crmapp" ? demoApi(route, JSON.parse(JSON.stringify(body))) : Promise.reject(new Error("Not in the demo."));
  const h = await authHeaders();
  if (!h) throw new Error("not paired");
  const r = await fetch(FN + "/" + group + "/" + route, { method: "POST", headers: { "content-type": "application/json", ...h }, body: JSON.stringify({ tz: TZ, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { $("#gate").classList.add("on"); throw new Error("not paired"); }
  if (!r.ok) throw new Error(j.error || `The CRM couldn't be reached (${r.status}).`);
  return j;
}
function reindex() { I = X.index(D); }
function put(table, row) {
  const arr = D[table], i = arr.findIndex((r) => r.id === row.id);
  if (i >= 0) arr[i] = row; else arr.push(row);
}
async function save(table, row) {
  const { row: saved } = await api("save", { table, row });
  put(table, saved); reindex();
  return saved;
}
async function remove(table, id) {
  await api("delete", { table, id });
  if (table === "people") {
    const invs = D.invoices.filter((i) => i.person === id).map((i) => i.id);
    D.payments = D.payments.filter((p) => !invs.includes(p.invoice));
    for (const t of ["estimates", "jobs", "plans", "invoices"]) D[t] = D[t].filter((r) => r.person !== id);
  }
  if (table === "invoices") { D.payments = D.payments.filter((p) => p.invoice !== id); for (const j of D.jobs) if (j.invoice === id) j.invoice = null; }
  if (table === "plans") D.jobs = D.jobs.filter((j) => !(j.plan === id && j.status === "scheduled" && j.date >= TODAY));
  D[table] = D[table].filter((r) => r.id !== id);
  reindex();
}
async function savePlan(plan, from, anchor) {
  const r = await api("plan", { plan, from, anchor });
  put("plans", r.plan);
  D.jobs = D.jobs.filter((j) => !r.remove.includes(j.id)).concat(r.add);
  reindex();
  return r;
}
async function load() {
  const d = await api("data", {});
  D = { people: d.people, services: d.services, estimates: d.estimates, plans: d.plans, jobs: d.jobs, invoices: d.invoices, payments: d.payments, settings: d.settings || {},
    employees: d.employees || [], roles: d.roles || X.normalizeRoles(null), pins: d.pins || [], areas: d.areas || [], tracks: d.tracks || [] };
  if (d.today) TODAY = d.today;
  reindex();
}
let toastT = 0;
function toast(msg, err = false) {
  const t = $("#toast"); t.innerHTML = ic(err ? "x" : "check") + `<span>${esc(msg)}</span>`; t.className = "on" + (err ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => (t.className = ""), err ? 5200 : 2600);
}
async function busy(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { console.error(e); toast(e.message || String(e), true); }
  finally { if (btn) btn.disabled = false; }
}

function spark(values, kind = "line") {
  const vs = values.map((x) => +x || 0), max = Math.max(1, ...vs), n = vs.length, W = 92, H = 34;
  if (kind === "bars") {
    const bw = W / n - 3;
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">${vs.map((x, i) => `<rect x="${i * (W / n) + 1.5}" y="${H - Math.max(2, x / max * (H - 2))}" width="${bw}" height="${Math.max(2, x / max * (H - 2))}" rx="2" fill="var(--acc)" opacity="${0.35 + 0.65 * (i + 1) / n}"/>`).join("")}</svg>`;
  }
  const pts = vs.map((x, i) => [i / Math.max(1, n - 1) * W, H - 3 - x / max * (H - 6)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const id = "sg" + Math.random().toString(36).slice(2, 7);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".35"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[n - 1][0]}" cy="${pts[n - 1][1]}" r="2.6" fill="var(--acc)"/></svg>`;
}

const weekStartOf = (d) => X.addDays(d, -X.weekday(d));

    </div>

function dayMoney(day) { return X.moneyBetween(D, I, day, day); }
function monthGrid(date, from, to) {

function viewCustomers(v, r) {
  setTitle("Customers");
  const type = r.q.get("type") || "residential", f = r.q.get("f") || "all", q = (r.q.get("q") || "").toLowerCase();
  const custs = D.people.filter((p) => p.kind === "customer" && p.status === "active");
  const info = new Map(custs.map((p) => [p.id, { plan: X.activePlan(I, p.id, TODAY), next: X.nextJob(I, p.id, TODAY), last: X.lastJob(I, p.id, TODAY),
    bal: (I.invoicesOf.get(p.id) || []).reduce((s, i) => s + X.balanceOf(I, i), 0) }]));
  const ofType = custs.filter((p) => type === "all" || p.type === type);
  const filt = {
    all: () => true, recurring: (p) => !!info.get(p.id).plan, one: (p) => !info.get(p.id).plan,
    none: (p) => !info.get(p.id).next, owes: (p) => info.get(p.id).bal > 0.005,
  };
  const shown = ofType.filter(filt[f] || filt.all).filter((p) => !q || [X.nameOf(p), X.addressOf(p), ...(p.phones || []).map((x) => x.n), ...(p.emails || [])].join(" ").toLowerCase().includes(q))

function readPerson(root, base, prefix = "") {
  const g = (k) => ($(`[name="${prefix}${k}"]`, root)?.value ?? "").trim();
  const type = $("[data-ptype] .on", root)?.dataset.t || base.type || "residential";
  const phone = g("phone"), email = g("email");
  const phones = (base.phones || []).slice(); if (phone) { if (phones[0]) phones[0] = { ...phones[0], n: phone }; else phones.push({ n: phone, label: "mobile" }); } else phones.splice(0, 1);
  const emails = (base.emails || []).slice(); if (email) emails[0] = email; else emails.splice(0, 1);
  return { ...base, id: base.id || X.uuid(), kind: base.kind || "prospect", type, first: g("first"), last: g("last"), company: g("company"), phones, emails,
    address: g("address"), city: g("city"), state: g("state"), zip: g("zip"), source: g("source"), notes: g("notes"), status: base.status || "active", created: base.created || TODAY };
}
function segWire(root) { for (const s of $$("[data-ptype]", root)) s.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $$("button", s).forEach((x) => x.classList.toggle("on", x === b)); }; }
function personSheet(p) {

}

function linesEditor(host, lines, onChange) {
  const presets = presetOptions();

        <label class="f"><span class="show-phone">Price per</span><input class="inp" data-k="rate" value="${l.rate === "" || l.rate == null ? "" : +l.rate}" inputmode="decimal" style="text-align:right" placeholder="0.00"></label>
        <label class="f"><span class="show-phone">Amount</span><input class="inp" data-k="qty" value="${l.qty === "" || l.qty == null ? "" : +l.qty}" inputmode="decimal" style="text-align:right" placeholder="1">${l.unit ? `<span class="unit">${esc(l.unit)}</span>` : ""}</label>
        <div class="ltot">${money(X.lineTotal(l))}</div>
        <button type="button" class="iconbtn x" data-del="${i}" aria-label="Remove line">${ic("x")}</button>
        <label class="f desc"><textarea class="inp" data-k="description" rows="${Math.min(8, Math.max(2, String(l.description || "").split("\n").length))}" placeholder="Description the customer sees">${esc(l.description)}</textarea></label></div>`).join("")}</div>
      <datalist id="presetList">${presets.map((s) => `<option value="${esc(s.name)}">`).join("")}</datalist>
      <div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-addline>${ic("plus")}Blank line</button><span class="muted small">or add a preset:</span></div>
      <div class="presets" style="margin-top:8px">${presets.map((s) => `<button type="button" class="chip" data-preset="${s.id}">${esc(s.name)}${s.rate ? ` <span class="n">${money(s.rate)}${s.unit ? " " + esc(s.unit) : ""}</span>` : ""}</button>`).join("")}</div>`;
    paintIcons(host);
  };
  const fixTotals = () => { for (const row of $$(".lrow", host)) { const l = lines[+row.dataset.i]; $(".ltot", row).textContent = money(X.lineTotal(l)); } };
  host.oninput = (e) => {
    const inp = e.target.closest("[data-k]"); if (!inp) return;
    const l = lines[+inp.closest(".lrow").dataset.i], k = inp.dataset.k;
    if (k === "rate" || k === "qty") l[k] = inp.value.replace(/[^0-9.\-]/g, "") === "" ? "" : parseFloat(inp.value.replace(/[^0-9.\-]/g, "")) || 0;
    else l[k] = inp.value;
    delete l.total;   // the total follows price x amount once Ben edits a line
    if (k === "description") inp.rows = Math.min(8, Math.max(2, inp.value.split("\n").length));
    fixTotals(); onChange();
  };
  host.addEventListener("change", (e) => {   // picking a preset name in a blank line fills its description and price
    const inp = e.target.closest('[data-k="service"]'); if (!inp) return;
    const l = lines[+inp.closest(".lrow").dataset.i], s = presets.find((x) => x.name.toLowerCase() === inp.value.trim().toLowerCase());
    if (s && !String(l.description || "").trim()) { l.description = s.description || ""; if (l.rate === "" || l.rate == null || +l.rate === 0) l.rate = +s.rate || 0; l.unit = s.unit || ""; draw(); onChange(); }
  });
  host.onclick = (e) => {
    const d = e.target.closest("[data-del]"); if (d) { lines.splice(+d.dataset.del, 1); draw(); onChange(); return; }
    if (e.target.closest("[data-addline]")) { lines.push({ service: "", description: "", rate: "", qty: 1 }); draw(); onChange(); $$(".lrow", host).pop()?.querySelector("input")?.focus(); return; }
    const pr = e.target.closest("[data-preset]");
    if (pr) { const s = I.services.get(pr.dataset.preset);
      if (lines.length && !lines.some((l) => String(l.service || "").trim() || String(l.description || "").trim() || +l.rate)) lines.length = 0;   // replace the empty starter line
      lines.push({ service: s.name, description: s.description || "", rate: +s.rate || 0, qty: 1, unit: s.unit || "" });
      draw(); onChange(); const q = $$(".lrow", host).pop()?.querySelector('[data-k="qty"]'); if (q) { q.focus(); q.select(); } }
  };
  draw();
  return { redraw: draw };
}
const cleanLines = (lines) => lines.filter((l) => String(l.service || "").trim() || String(l.description || "").trim() || +l.rate)
  .map((l) => { const o = { service: String(l.service || "").trim(), description: String(l.description || "").trim(), rate: +l.rate || 0, qty: l.qty === "" || l.qty == null ? 1 : +l.qty || 0 };
    if (l.unit) o.unit = l.unit; o.total = l.total != null && l.total !== "" ? +l.total : X.round2(o.rate * o.qty); if (l.to) o.to = l.to; return o; });

function to24(t) {
  const m = String(t || "").match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return "";
  let h = +m[1]; if (m[3]) { if (/pm/i.test(m[3]) && h < 12) h += 12; if (/am/i.test(m[3]) && h === 12) h = 0; }
  return String(h).padStart(2, "0") + ":" + m[2];
}
function from24(v) {
  if (!v) return "";
  const [h, m] = v.split(":").map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
}

      <div class="fgrid"><label class="f">Date<input type="date" id="date" value="${esc(inv.date || TODAY)}"></label><label class="f">Due<input type="date" id="due" value="${esc(inv.due || inv.date || TODAY)}"></label></div>
      <div class="muted small">Total</div><div class="big" id="tot"></div>
      ${isNew ? "" : `<div class="row small"><span class="muted">Paid</span><div class="spacer"></div><b>${money(X.paidOf(I, src))}</b></div>
        <div class="row"><span class="muted">Balance</span><div class="spacer"></div><b style="font-size:18px;color:${X.balanceOf(I, src) > 0.005 ? "var(--warn)" : "var(--good)"}">${money(X.balanceOf(I, src))}</b></div>`}
      <div class="row"><button class="btn primary" id="save" style="flex:1">${ic("check")}Save invoice</button><button class="btn" id="prt" title="Print or save as PDF">${ic("print")}</button></div>
      ${isNew ? "" : `<button class="btn good" id="pay">${ic("dollar")}Record a payment</button>
        <label class="check small"><input type="checkbox" id="bad" ${inv.bad_debt ? "checked" : ""}>Bad debt (won't be paid)</label>
        <button class="btn ghost sm" id="del" style="align-self:flex-start;color:var(--bad)">${ic("trash")}Delete invoice</button>`}
    </div>
    ${isNew ? "" : `<div class="card"><h3>Payments</h3><div class="list">${pays.map((p) => `<div class="li"><div class="main"><div class="t">${money(p.amount)} · ${esc(p.method || "")}</div><div class="s">${X.niceDate(p.date, { year: true })}${p.note ? " · " + esc(p.note) : ""}</div></div>
      <button class="iconbtn" data-delpay="${p.id}" aria-label="Remove payment">${ic("trash")}</button></div>`).join("") || '<div class="empty">No payments yet</div>'}</div></div>`}
    </div></div>`;
  const onChange = () => { changed = true; $("#tot", v).textContent = money(X.linesTotal(cleanLines(inv.lines))); };
  const picker = personPicker($("#who", v), state, onChange, "customer");
  linesEditor($("#lines", v), inv.lines, onChange);
  $("#tot", v).textContent = money(X.linesTotal(cleanLines(inv.lines)));
  for (const id of ["notes", "num", "date", "due"]) $("#" + id, v).addEventListener("input", onChange);
  dirty = () => changed || state.newPerson;
  const doSave = async () => {
    const person = await picker.resolve();
    const lines = cleanLines(inv.lines);
    if (!lines.length) throw new Error("Add at least one line.");
    const p = I.people.get(person);
    if (p && p.kind !== "customer") await save("people", { ...p, kind: "customer", status: "active" });
    const row = { ...inv, person, lines, total: X.linesTotal(lines), notes: $("#notes", v).value.trim(), number: $("#num", v).value.trim() || inv.number,
      date: $("#date", v).value || TODAY, due: $("#due", v).value || $("#date", v).value || TODAY, bad_debt: $("#bad", v) ? $("#bad", v).checked : false };
    const s = await save("invoices", row); changed = false; dirty = null; return s;
  };

  $("#prt", v).onclick = (ev) => busy(ev.currentTarget, async () => { const s = changed || isNew ? await doSave() : src; printDoc("invoice", s); history.replaceState(null, "", "#/invoice/" + s.id); render(); });
  if ($("#pay", v)) $("#pay", v).onclick = () => paymentSheet(I.invoices.get(inv.id));
  if ($("#bad", v)) $("#bad", v).onchange = (ev) => busy(null, async () => { await save("invoices", { ...src, bad_debt: ev.target.checked }); render(); });
  if ($("#del", v)) $("#del", v).onclick = (ev) => { if (!confirm(`Delete invoice #${inv.number} and its payments? This can't be undone.`)) return; busy(ev.currentTarget, async () => { await remove("invoices", inv.id); dirty = null; toast("Deleted."); go("invoices"); }); };
  v.addEventListener("click", (e) => { const d = e.target.closest("[data-delpay]"); if (!d) return; if (!confirm("Remove this payment?")) return; busy(d, async () => { await remove("payments", d.dataset.delpay); render(); }); });
}
function paymentSheet(inv) {
  if (!inv) return;
  const bal = X.balanceOf(I, inv);
  openSheet(`Payment · invoice #${inv.number}`, `<div class="muted">${esc(name(inv.person))} owes <b style="color:var(--ink)">${money(bal)}</b> of ${money(inv.total)}.</div>
    <div class="fgrid"><label class="f">Amount<input id="pa" inputmode="decimal" value="${bal > 0 ? bal : ""}"></label><label class="f">Date<input type="date" id="pd" value="${TODAY}"></label>
    <div class="full"><div class="lbl">Paid by</div><div class="chips" id="pm">${X.METHODS.filter((m) => m !== "credit").map((m, i) => `<button type="button" class="chip ${i === 1 ? "on" : ""}" data-m="${m}">${m}</button>`).join("")}</div></div>
    <label class="f full">Note (check number, etc.)<input id="pn"></label></div>
    <div class="sheetfoot"><button class="btn" id="pc">Cancel</button><button class="btn primary" id="ps">${ic("check")}Record payment</button></div>`, (b) => {
    $("#pm", b).onclick = (e) => { const c = e.target.closest("[data-m]"); if (c) $$("[data-m]", b).forEach((x) => x.classList.toggle("on", x === c)); };
    $("#pc", b).onclick = () => closeSheet();
    $("#ps", b).onclick = (e) => busy(e.currentTarget, async () => {
      const amount = X.round2(parseFloat($("#pa", b).value.replace(/[^0-9.]/g, "")));
      if (!(amount > 0)) throw new Error("Enter the amount paid.");
      await save("payments", { id: X.uuid(), invoice: inv.id, amount, date: $("#pd", b).value || TODAY, method: $("[data-m].on", b)?.dataset.m || "other", note: $("#pn", b).value.trim() });
      toast(`${money(amount)} recorded.`); closeSheet(); render();
    });
  });
}

      drawPerms(); mark();
    } else if (t.dataset.tr) { const tr = e.trainings[+t.dataset.tr]; tr.done = t.checked ? TODAY : null; drawTrainings(); paintIcons(v); mark(); }
    else if (t.id === "role") { e.role = t.value; drawPerms(); mark(); }
    else if (t.id === "active") { e.status = t.checked ? "active" : "inactive"; mark(); }

  const addTraining = () => { const n = $v("#trNew").value.trim(); if (!n) return; e.trainings.push({ name: n.slice(0, 80), done: null }); $v("#trNew").value = ""; drawTrainings(); paintIcons(v); mark(); };
  $v("#trAdd").onclick = addTraining;
  $v("#trNew").onkeydown = (ev) => { if (ev.key === "Enter") { ev.preventDefault(); addTraining(); } };
  $v("#save").onclick = (ev) => busy(ev.currentTarget, async () => {
    if (!String(e.first || "").trim() && !String(e.last || "").trim()) throw new Error("Give them a name first.");
    const row = { ...e, first: String(e.first || "").trim(), last: String(e.last || "").trim(), pay_rate: +String(e.pay_rate).replace(/[^0-9.]/g, "") || 0,
      commission: +String(e.commission).replace(/[^0-9.]/g, "") || 0, start: e.start || null };
    const saved = (await api("save", { table: "employees", row })).row;
    put("employees", saved);
    changed = false; dirty = null;
    toast(isNew ? `${X.empName(saved)} added.` : "Saved.");

  if ($v("#del")) $v("#del").onclick = (ev) => {
    if (!confirm(`Delete ${X.empName(e)}? To keep their history, untick "Working here" instead.`)) return;
    busy(ev.currentTarget, async () => { await remove("employees", e.id); dirty = null; toast("Deleted."); go("employees"); });
  };
}

  if (!permRole || !roles.some((r) => r.id === permRole)) permRole = (roles[1] || roles[0]).id;
  const people = (id) => D.employees.filter((e) => e.role === id && e.status === "active").length;
  const draw = () => {
    v.innerHTML = `<div class="wrap">
      <div class="pagehead"><div><h2>Roles &amp; permissions</h2><div class="sub">What each kind of employee can see and do. Change one person's exceptions on their own page.</div></div>
        <div class="spacer"></div><button class="btn" id="addRole">${ic("plus")}New role</button><button class="btn primary" id="saveRoles" ${changed ? "" : "disabled"}>${ic("check")}Save changes</button></div>
      ${loginNote}

        ${roles.map((ro) => `<th><button class="rolehead" data-edit="${ro.id}" ${ro.locked ? "disabled" : ""}><b>${esc(ro.name)}${ro.locked ? ` ${ic("lock")}` : ""}</b><small>${people(ro.id)} ${people(ro.id) === 1 ? "person" : "people"}</small></button></th>`).join("")}</tr></thead>
        <tbody>${X.PERMISSIONS.map(([grp, ps]) => `<tr class="pgrow"><td colspan="${roles.length + 1}">${esc(grp)}</td></tr>` + ps.map(([k, label]) => `<tr><td class="pcol">${esc(label)}</td>
          ${roles.map((ro) => `<td><span class="check"><input type="checkbox" data-role="${ro.id}" data-perm="${k}" ${ro.perms[k] ? "checked" : ""} ${ro.locked ? "disabled" : ""} aria-label="${esc(ro.name)}: ${esc(label)}"></span></td>`).join("")}</tr>`).join("")).join("")}</tbody></table></div></div>
      <div class="show-phone">
        <div class="chips" style="margin-bottom:12px">${roles.map((ro) => `<button class="chip ${ro.id === permRole ? "on" : ""}" data-pick="${ro.id}">${esc(ro.name)} <span class="n">${people(ro.id)}</span></button>`).join("")}</div>
        ${(() => { const ro = roles.find((x) => x.id === permRole); return `<div class="card"><h3>${esc(ro.name)}${ro.locked ? "" : `<button class="btn sm right" data-edit="${ro.id}" style="margin-left:auto">${ic("edit")}Rename</button>`}</h3>
          <div class="small muted" style="margin-bottom:8px">${esc(ro.desc || "")}</div>
          ${X.PERMISSIONS.map(([grp, ps]) => `<div class="pgrp">${esc(grp)}</div>` + ps.map(([k, label]) => `<label class="prow"><span>${esc(label)}</span><span class="check"><input type="checkbox" data-role="${ro.id}" data-perm="${k}" ${ro.perms[k] ? "checked" : ""} ${ro.locked ? "disabled" : ""}></span></label>`).join("")).join("")}</div>`; })()}
      </div></div>`;
    paintIcons(v);
  };
  draw();
  dirty = () => changed;
  v.addEventListener("change", (ev) => {
    const t = ev.target; if (!t.dataset.perm) return;
    const ro = roles.find((r) => r.id === t.dataset.role); if (!ro || ro.locked) return;
    ro.perms[t.dataset.perm] = t.checked; changed = true;
    $("#saveRoles", v).disabled = false;
  });
  v.addEventListener("click", (ev) => {
    const pk = ev.target.closest("[data-pick]"); if (pk) { permRole = pk.dataset.pick; draw(); return; }
    const ed = ev.target.closest("[data-edit]"); if (ed && !ed.disabled) { roleSheet(roles, roles.find((r) => r.id === ed.dataset.edit), () => { changed = true; draw(); }); return; }
    if (ev.target.closest("#addRole")) { roleSheet(roles, null, (r) => { changed = true; permRole = r.id; draw(); }); return; }
    if (ev.target.closest("#saveRoles")) busy(ev.target.closest("#saveRoles"), async () => {
      const { roles: saved } = await api("roles", { roles });
      D.roles = saved; changed = false; dirty = null; toast("Permissions saved."); render();
    });
  });
}
function roleSheet(roles, role, done) {
  const isNew = !role;
  const used = role ? D.employees.filter((e) => e.role === role.id).length : 0;
  openSheet(isNew ? "New role" : "Edit role", `<div class="fgrid"><label class="f full">Name<input id="rn" value="${esc(role ? role.name : "")}" placeholder="e.g. Office manager"></label>
    <label class="f full">What this role is for<input id="rd" value="${esc(role ? role.desc : "")}"></label>
    ${isNew ? `<label class="f full">Start with the switches of<select id="rc">${roles.map((r) => `<option value="${r.id}" ${r.id === "tech" ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>` : ""}</div>
    ${!isNew ? `<div class="small muted">${used ? `${used} ${used === 1 ? "person has" : "people have"} this role, so it can't be deleted.` : "Nobody has this role."}</div>` : ""}
    <div class="sheetfoot">${!isNew && !used ? `<button class="btn bad" id="rx">${ic("trash")}Delete role</button>` : ""}<div class="spacer"></div><button class="btn primary" id="rs">${isNew ? "Add role" : "Done"}</button></div>`, (b) => {
    $("#rs", b).onclick = () => {
      const name = $("#rn", b).value.trim(); if (!name) return toast("Give the role a name.", true);
      if (isNew) {
        const from = roles.find((r) => r.id === $("#rc", b).value) || roles[0];
        const r = { id: "r-" + X.uuid().slice(0, 8), name, desc: $("#rd", b).value.trim(), perms: { ...from.perms } };
        roles.push(r); closeSheet(); done(r);
      } else { role.name = name; role.desc = $("#rd", b).value.trim(); closeSheet(); done(role); }
    };
    if ($("#rx", b)) $("#rx", b).onclick = () => { roles.splice(roles.indexOf(role), 1); closeSheet(); done(roles[1] || roles[0]); };
  });
}

// ------------------------------------------------------------------ door knocking (2026-11-21)
// Google Maps when Ben has added a key (Settings), otherwise a free street map (Leaflet + OpenStreetMap).
// Both sit behind one small "engine" so the page doesn't care which one is showing.
let MAPENG = null;
const HOME = [40.3141, -112.0103];   // Eagle Mountain, UT (Ben's town) until his location or a saved view is known
const scriptOnce = (src) => new Promise((res, rej) => { if ([...document.scripts].some((x) => x.src === src)) return res(); const sc = document.createElement("script"); sc.src = src; sc.async = true; sc.onload = res; sc.onerror = () => rej(new Error("Couldn't load " + src.split("/")[2])); document.head.appendChild(sc); });
const cssOnce = (href) => { if (![...document.querySelectorAll("link")].some((l) => l.href === href)) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.appendChild(l); } };
async function mapEngine() {
  if (MAPENG) return MAPENG;
  const key = (D.settings && D.settings.maps_key) || "";
  if (key && !DEMO) {
    try {
      await new Promise((res, rej) => {
        if (window.google && window.google.maps) return res();
        window.__vitraMapsReady = res; window.gm_authFailure = () => { toast("Google refused the Maps key. Check it in Settings; showing the free map for now.", true); };
        scriptOnce(`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly&callback=__vitraMapsReady`).catch(rej);
        setTimeout(() => rej(new Error("Google Maps took too long")), 15000);
      });
      return (MAPENG = googleEngine());
    } catch (e) { console.warn(e); toast("Google Maps didn't load; showing the free map.", true); }
  }
  cssOnce("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css");
  await scriptOnce("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js");
  return (MAPENG = leafletEngine());
}
function leafletEngine() {
  const L = window.L;
  return {
    name: "free", satellite: false,
    create(el, center, zoom) {
      const m = L.map(el, { zoomControl: false, attributionControl: true, preferCanvas: true }).setView(center, zoom);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(m);
      L.control.zoom({ position: "bottomright" }).addTo(m);
      const api = {
        raw: m,
        onClick: (fn) => m.on("click", (e) => fn([e.latlng.lat, e.latlng.lng])),
        onMove: (fn) => m.on("moveend", () => { const c = m.getCenter(); fn([c.lat, c.lng], m.getZoom()); }),
        setView: (c, z) => m.setView(c, z ?? m.getZoom()), zoom: () => m.getZoom(),
        fit: (path) => path.length && m.fitBounds(L.latLngBounds(path), { padding: [40, 40], maxZoom: 18 }),
        marker(ll, st, onClick) {
          const o = L.circleMarker(ll, { radius: st.size || 8, color: st.ring || "#fff", weight: st.ringW ?? 2, fillColor: st.color, fillOpacity: st.opacity ?? 1, bubblingMouseEvents: false }).addTo(m);
          if (onClick) o.on("click", (e) => { L.DomEvent.stopPropagation(e); onClick(); });
          return { remove: () => o.remove(), set: (s2) => o.setStyle({ fillColor: s2.color, radius: s2.size || 8, color: s2.ring || "#fff", fillOpacity: s2.opacity ?? 1 }), move: (p) => o.setLatLng(p) };
        },
        polygon(path, st) {
          const o = L.polygon(path, { color: st.stroke, weight: st.weight || 2, dashArray: st.dashed ? "6 6" : null, fillColor: st.fill, fillOpacity: st.fillOpacity, interactive: false }).addTo(m);
          return { remove: () => o.remove(), setPath: (p) => o.setLatLngs(p) };
        },
        line(path, st) {
          const o = L.polyline(path, { color: st.color, weight: st.weight || 3, opacity: st.opacity ?? 0.9, dashArray: st.dashed ? "6 6" : null, interactive: false }).addTo(m);
          return { remove: () => o.remove(), setPath: (p) => o.setLatLngs(p) };
        },
        circle(ll, r, st) { const o = L.circle(ll, { radius: r, color: st.color, weight: 1, fillColor: st.color, fillOpacity: 0.12, interactive: false }).addTo(m);
          return { remove: () => o.remove(), move: (p, r2) => { o.setLatLng(p); if (r2) o.setRadius(r2); } }; },
        setLayer() {}, resize: () => m.invalidateSize(),
      };
      return api;
    },
    async reverse(ll) {   // OpenStreetMap's address lookup (one at a time, only when Ben taps a house)
      try { const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${ll[0]}&lon=${ll[1]}`); const j = await r.json();
        const a = j.address || {}; return [[a.house_number, a.road].filter(Boolean).join(" "), a.city || a.town || a.village || ""].filter(Boolean).join(", ") || j.display_name || ""; } catch { return ""; }
    },
    async geocode(q) {
      try { const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q=${encodeURIComponent(q)}`); const j = await r.json(); return j[0] ? [+j[0].lat, +j[0].lon] : null; } catch { return null; }
    },
  };
}
function googleEngine() {
  const G = window.google.maps;
  let geocoder = null;
  const gc = () => (geocoder ||= new G.Geocoder());
  const ll = (p) => ({ lat: p[0], lng: p[1] });
  return {
    name: "google", satellite: true,
    create(el, center, zoom) {
      const m = new G.Map(el, { center: ll(center), zoom, mapTypeId: "roadmap", disableDefaultUI: true, zoomControl: true, clickableIcons: false, gestureHandling: "greedy",
        zoomControlOptions: { position: G.ControlPosition.RIGHT_BOTTOM }, styles: [{ featureType: "poi", stylers: [{ visibility: "off" }] }] });
      const sym = (st) => ({ path: G.SymbolPath.CIRCLE, scale: st.size || 8, fillColor: st.color, fillOpacity: st.opacity ?? 1, strokeColor: st.ring || "#fff", strokeWeight: st.ringW ?? 2 });
      return {
        raw: m,
        onClick: (fn) => m.addListener("click", (e) => fn([e.latLng.lat(), e.latLng.lng()])),
        onMove: (fn) => m.addListener("idle", () => { const c = m.getCenter(); fn([c.lat(), c.lng()], m.getZoom()); }),
        setView: (c, z) => { m.panTo(ll(c)); if (z) m.setZoom(z); }, zoom: () => m.getZoom(),
        fit: (path) => { if (!path.length) return; const b = new G.LatLngBounds(); path.forEach((p) => b.extend(ll(p))); m.fitBounds(b, 40); },
        marker(p, st, onClick) {
          const o = new G.Marker({ position: ll(p), map: m, icon: sym(st), clickable: !!onClick, zIndex: st.z || 1 });
          if (onClick) o.addListener("click", onClick);
          return { remove: () => o.setMap(null), set: (s2) => o.setIcon(sym(s2)), move: (q) => o.setPosition(ll(q)) };
        },
        polygon(path, st) {
          const o = new G.Polygon({ paths: path.map(ll), map: m, strokeColor: st.stroke, strokeOpacity: st.dashed ? 0 : 0.95, strokeWeight: st.weight || 2, fillColor: st.fill, fillOpacity: st.fillOpacity, clickable: false });
          const dash = st.dashed ? new G.Polyline({ path: [...path, path[0]].map(ll), map: m, strokeOpacity: 0, clickable: false,
            icons: [{ icon: { path: "M 0,-1 0,1", strokeOpacity: 1, strokeColor: st.stroke, scale: 2.5 }, offset: "0", repeat: "11px" }] }) : null;
          return { remove: () => { o.setMap(null); if (dash) dash.setMap(null); }, setPath: (q) => { o.setPaths(q.map(ll)); if (dash) dash.setPath([...q, q[0]].map(ll)); } };
        },
        line(path, st) {
          const o = new G.Polyline({ path: path.map(ll), map: m, strokeColor: st.color, strokeOpacity: st.dashed ? 0 : (st.opacity ?? 0.9), strokeWeight: st.weight || 3, clickable: false,
            icons: st.dashed ? [{ icon: { path: "M 0,-1 0,1", strokeOpacity: 1, strokeColor: st.color, scale: 2.5 }, offset: "0", repeat: "11px" }] : [] });
          return { remove: () => o.setMap(null), setPath: (q) => o.setPath(q.map(ll)) };
        },
        circle(p, r, st) { const o = new G.Circle({ center: ll(p), radius: r, map: m, strokeColor: st.color, strokeWeight: 1, fillColor: st.color, fillOpacity: 0.12, clickable: false });
          return { remove: () => o.setMap(null), move: (q, r2) => { o.setCenter(ll(q)); if (r2) o.setRadius(r2); } }; },
        setLayer: (k) => m.setMapTypeId(k === "satellite" ? "hybrid" : "roadmap"), resize: () => {},
      };
    },
    reverse: (p) => gc().geocode({ location: ll(p) }).then((r) => { const a = r.results[0]; return a ? a.formatted_address.replace(/, USA$/, "").replace(/ \d{5}(-\d{4})?$/, "") : ""; }).catch(() => ""),
    geocode: (q) => gc().geocode({ address: q }).then((r) => { const g = r.results[0]; return g ? [g.geometry.location.lat(), g.geometry.location.lng()] : null; }).catch(() => null),
  };

// customers with an address get a spot on the map (Google only: a few per visit, saved so it happens once)
let geoBusy = false;
async function geocodeCustomers() {
  if (geoBusy || !KN || !KN.E || KN.E.name !== "google" || DEMO) return;
  geoBusy = true;
  try {
    const todo = D.people.filter((p) => p.kind === "customer" && p.status === "active" && p.lat == null && p.address).slice(0, 25);
    for (const p of todo) {
      const ll = await KN.E.geocode(X.addressOf(p) + (p.state ? "" : ", UT"));
      if (ll) { p.lat = ll[0]; p.lng = ll[1]; await api("geo", { id: p.id, lat: ll[0], lng: ll[1] }).catch(() => {}); }
      else { p.lat = 0; p.lng = 0; }   // not found: don't try again this visit
      await new Promise((r) => setTimeout(r, 250));
    }
    reindex(); drawPins();
  } finally { geoBusy = false; }
}

function periodRange(key) {
  const y = +TODAY.slice(0, 4), m = +TODAY.slice(5, 7), pad = (n) => String(n).padStart(2, "0");
  const end = (yy, mm) => X.addDays(X.addMonths(`${yy}-${pad(mm)}-01`, 1), -1);
  switch (key) {
    case "month": return [`${y}-${pad(m)}-01`, TODAY, "This month"];
    case "lastmonth": { const d = X.addMonths(`${y}-${pad(m)}-01`, -1); return [d, end(+d.slice(0, 4), +d.slice(5, 7)), "Last month"]; }

async function uploadSheet(f) {
  const text = await f.text();
  const isOfx = /\.(qbo|ofx|qfx)$/i.test(f.name) || /<OFX>|OFXHEADER/i.test(text.slice(0, 2000));
  let entries = [], rows = null, cols = null, flip = false;
  if (isOfx) entries = B.parseOFX(text);
  else { rows = B.parseCSV(text); cols = B.guessColumns(rows[0] || []); }

// Connect a bank: the same Plaid Link as Jarvis › Money, into the business book.
function plaidScript() {
  if (window.Plaid) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.plaid.com/link/v2/stable/link-initialize.js"; sc.onload = res; sc.onerror = () => rej(new Error("Couldn't load Plaid.")); document.head.appendChild(sc); });
}
async function linkBank() {
  if (DEMO) throw new Error("The demo can't link a bank.");
  const [{ link_token }] = await Promise.all([call("money", "link", { book: "business" }), plaidScript()]);
  try { localStorage.setItem("jarvis.plaidLink", link_token); localStorage.setItem("jarvis.plaidBook", "business"); } catch {}   // banks that sign in on their own site finish in Jarvis › Money
  window.Plaid.create({ token: link_token,
    onSuccess: async (public_token, meta) => {
      toast(`Connecting ${(meta.institution && meta.institution.name) || "your bank"}… the first sync can take a minute.`);
      try { await call("money", "exchange", { public_token, institution: meta.institution && meta.institution.name, book: "business" }); await loadBooks(false); toast("Bank connected."); render(); }
      catch (e) { toast(e.message, true); }
      try { localStorage.removeItem("jarvis.plaidLink"); } catch {}
    },
    onExit: (err) => { try { localStorage.removeItem("jarvis.plaidLink"); } catch {} if (err) toast(err.display_message || err.error_message || "Linking stopped.", true); },
  }).open();
}

let demoDb = null;
function demoApi(route, b) {
  if (!demoDb) demoDb = demoData();
  const DB = demoDb;
  if (route === "data") return JSON.parse(JSON.stringify(DB));
  if (route === "save") { const arr = DB[b.table], i = arr.findIndex((r) => r.id === b.row.id); if (i >= 0) arr[i] = b.row; else arr.push(b.row); return { row: JSON.parse(JSON.stringify(b.row)) }; }
  if (route === "delete") {
    if (b.table === "people") { for (const t of ["estimates", "jobs", "plans", "invoices"]) DB[t] = DB[t].filter((r) => r.person !== b.id); }
    if (b.table === "plans") DB.jobs = DB.jobs.filter((j) => !(j.plan === b.id && j.status === "scheduled" && j.date >= TODAY));
    DB[b.table] = DB[b.table].filter((r) => r.id !== b.id); return { ok: true };
  }
  if (route === "plan") {
    const i = DB.plans.findIndex((p) => p.id === b.plan.id); if (i >= 0) DB.plans[i] = b.plan; else DB.plans.push(b.plan);
    const r = X.regenPlan(b.plan, DB.jobs, b.from, b.anchor, TODAY);
    DB.jobs = DB.jobs.filter((j) => !r.remove.includes(j.id)).concat(r.add);
    return { plan: b.plan, remove: r.remove, add: JSON.parse(JSON.stringify(r.add)) };
  }
  if (route === "settings") { if (b.settings) DB.settings = { ...DB.settings, ...b.settings }; return { settings: DB.settings }; }
  if (route === "track" || route === "geo") return { ok: true };
  if (route === "roles") {
    const roles = X.normalizeRoles(b.roles);
    if (DB.employees.some((e) => !roles.some((r) => r.id === e.role))) throw new Error("Someone still has a role you removed. Give them another role first.");
    DB.roles = roles; return { roles };
  }
  if (route === "import") return { counts: { people: 0, jobs: 0, estimates: 0, invoices: 0 } };
  throw new Error("Not in the demo.");
}
